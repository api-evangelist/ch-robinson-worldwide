description: >-
  C.H. Robinson is one of the world's largest third-party logistics (3PL)
  providers, offering global freight transportation, supply chain management,
  customs brokerage, and sourcing of fresh produce. Its Navisphere
  transportation management system provides end-to-end supply chain planning,
  purchase order management, execution, freight payment, and business
  intelligence. C.H. Robinson exposes APIs that allow shippers and carriers to
  integrate quoting, booking, tracking, documents, and payment workflows
  directly into their own TMS or ERP platforms.
apis:
  - aid: ch-robinson:carrier-api
    name: C.H. Robinson Carrier API
    tags:
      - Booking
      - Carriers
      - Documents
      - Loads
      - Payment
      - Visibility
    humanURL: https://developer.chrobinson.com/carrier
    baseURL: https://api.navisphere.com
    properties:
      - url: https://developer.chrobinson.com/carrier
        type: Documentation
      - url: https://www.chrobinson.com/en-us/carriers/api-connectivity/
        type: Overview
      - url: openapi/ch-robinson-worldwide-rest-apis-openapi.yml
        type: OpenAPI
      - url: https://developer.chrobinson.com/api-reference
        type: APIReference
    description: >-
      The C.H. Robinson Carrier API enables carriers to find, offer, book,
      and auto-create loads directly from their own TMS, send visibility
      updates, upload documents for faster invoicing, and check payment
      status. The API is offered free to carriers to streamline integration
      with C.H. Robinson's logistics network.
  - aid: ch-robinson:shipper-navisphere-api
    name: C.H. Robinson Navisphere Shipper API
    tags:
      - Navisphere
      - Quoting
      - Shipments
      - Shippers
      - Tracking
      - TMS
    humanURL: https://www.chrobinson.com/en-us/technology/shipper-technology/navisphere/
    baseURL: https://api.navisphere.com
    properties:
      - url: https://developer.chrobinson.com/
        type: Documentation
      - url: https://www.chrobinson.com/en-us/shippers/lean-ai-supply-chains/connectivity-integrations/
        type: Overview
      - url: openapi/ch-robinson-worldwide-rest-apis-openapi.yml
        type: OpenAPI
      - url: https://developer.chrobinson.com/api-reference
        type: APIReference
    description: >-
      The Navisphere Shipper API integrates C.H. Robinson's global
      transportation management system into a shipper's TMS or ERP.
      Capabilities include real-time rate quoting, load tendering, shipment
      tracking and visibility, document exchange, freight audit and
      payment, and business intelligence access across multi-modal
      transportation (truckload, LTL, intermodal, ocean, air, customs).
