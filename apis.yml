  name: C.H. Robinson Visibility API
  description: Navisphere® Vision and Visibility tool is a global visibility technology that allows select
    customers to view and proactively manage their supply chain movements from a single platform. The
    tool combines real-time order and shipment information with transportation updates and external factors
    that can influence a supply chain, including weather, traffic, and current events to help customers
    prevent potential disruptions.
