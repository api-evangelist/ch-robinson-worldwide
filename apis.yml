description: C.H. Robinson is one of the world's largest third-party logistics (3PL) providers, offering
  global freight transportation, supply chain management, customs brokerage, and sourcing of fresh produce.
  Its Navisphere transportation management system provides end-to-end supply chain planning, purchase
  order management, execution, freight payment, and business intelligence. C.H. Robinson exposes APIs
  that allow shippers and carriers to integrate quoting, booking, tracking, documents, and payment workflows
  directly into their own TMS or ERP platforms.
