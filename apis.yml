- aid: ch-robinson-worldwide:ch-robinson-worldwide-rating-api
  name: C.H. Robinson Rating API
  description: "C.H. Robinson's rating product allows our customers to retrieve contractual or transactional\
    \ quotes. Customers can generate quotes with nothing more than weights and zip codes! However, the\
    \ more detailed the rate request, the more refined the quote is. C.H. Robinson has taken this functionality\
    \ a step further and can accommodate our customer's e-commerce platforms to be the rating engine they\
    \ use to give their customers shipping costs. One of the great features of C.H. Robinson's rating\
    \ API is the ability for customers to turn the received quote into an order. \n## Rating and Quote\
    \ to Order \n\nTo maximize the quote to order experience, we require more information than the bare\
    \ minimum required parameters. Each parameter that has these \"conditional\" requirements has been\
    \ specifically called out in the parameter description.\n See [Order Create With Quote ID](https://developer.chrobinson.com/api-reference#operation/Order%20Create%20with%20Quote%20ID)\
    \ to learn more about the Quote to Order process. \n\n #### Notes: \n * **Multi-Stop Shipments:**\
    \ For shipments with more than two stops (that is more than one pick and one drop), the Order Create\
    \ with Quote ID endpoint can receive only a quote ID and no other supplemental shipment data. \n *\
    \ **Incomplete Orders:** Orders created in C.H. Robinson's Navisphere® Order Management system will\
    \ be marked as incomplete if any data fields marked as “required” are not included. Incomplete orders\
    \ will require manual intervention by C.H. Robinson team members to be processed.\n\n## Rating and\
    \ Order Create \n\nAlternatively, you may also use the rating endpoint to retrieve a quote and use\
    \ the Order Create method to complete the resulting order tender into C.H. Robinson. Please review\
    \ the <a href=\"https://api.navisphere.com/api/B2B/Portal/v1/documents/descriptions/RatingWorkflowOptionsGuide.pdf\"\
    \ target=\"_blank\">Rating Workflow Options Guide</a> to understand the advantages and tradeoffs between\
    \ the Order Create and Order Create with QuoteID workflows. \n## Rating and Transactional Truckload\
    \ Quotes \n\nOur rating API can provide Real-time Transactional truckload quotes. These are also known\
    \ as Spot-Bid quotes or market rates. Please review the <a href=\"https://api.navisphere.com/api/B2B/Portal/v1/documents/descriptions/TransactionalTruckloadQuotingAndEquipmentGuide.pdf\"\
    \ target=\"_blank\">Transactional Truckload and Equipment Handling Guide</a> for more detail. \n##\
    \ Density Based Freight Classification \n\nThe NMFTA (National Motor Freight Traffic Association)\
    \ publishes the NMFC (National Motor Freight Classification) which is a standard for evaluating product\
    \ classifications for use in transportation. There are four transportation characteristics that are\
    \ used to determine product classifications: \n * Density \n * Stowability \n * Handling \n * Liability\n\
    \nIn many instances, all four characteristics hold equal weight in determining the product's classification.\
    \ However, in some instances, one characteristic can hold more weight than the other. For those commodities\
    \ that use Density as the primary determining factor for freight classification, C.H. Robinson provides\
    \ a service for retrieving the estimated classification, based solely on density, for further use\
    \ in the actual rate requests."
  humanURL: https://developer.chrobinson.com/carrier
  baseURL: https://api.navisphere.com
