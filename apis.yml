- aid: ch-robinson-worldwide:ch-robinson-worldwide-authentication-api
  name: C.H. Robinson Authentication API
  description: "C.H. Robinson uses OAuth v2.0 to secure connections to its APIs. oAuth v2 works by delegating\
    \ user authentication to the service that hosts the user account and authorizing third-party applications\
    \ to access the user account. For a user to authenticate and use any of C.H. Robinson's APIs, the\
    \ user must [generate a token](https://developer.chrobinson.com/api-reference#operation/Generate%20Token).\
    \ \n\n <span style=\"color:red\">**Special Note**</span> \n\n <span style=\"color:red\">Generated\
    \ tokens are valid for 24 hours. Users should only be hitting the C.H. Robinson authentication endpoint\
    \ once every 24 hours. Calling the authentication endpoint multiple times within the same 24 hour\
    \ period may result in users being subjected to rate limiting.</span> \n\nClick the image to open\
    \ it in a new tab to resize it.\n\n<a href=\"https://api.navisphere.com/api/B2B/Portal/v1/documents/descriptions/Auth_flow.jpeg\"\
    \ target=\"_blank\"><img src=\"https://api.navisphere.com/api/B2B/Portal/v1/documents/descriptions/Auth_flow.jpeg\"\
    \ alt=\"Authorization Object Model Diagram\"></a>"
