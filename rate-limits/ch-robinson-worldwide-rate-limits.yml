description: C.H. Robinson does not publish numeric rate limits on its developer portal. API access
  is gated by partner credentials issued to active customers/carriers; throttling and quotas are governed
  by the API onboarding agreement.
notes: No public per-second/per-minute rate limit numbers documented; partner-negotiated.
sources:
  - https://developer.chrobinson.com/
responseCodes:
  throttled: 429
  unauthorized: 401
limits:
  - name: Shipper API
    scope: api_key
    metric: varies
    limit: see partner agreement
  - name: Carrier API
    scope: api_key
    metric: varies
    limit: see partner agreement
policies:
  - name: Backoff Strategy
    description: Use exponential backoff with jitter on 429 / 503 responses; honor Retry-After when present.
  - name: Partner credential scope
    description: Credentials are scoped to the contracted shipper or carrier; calls outside the agreed
      surface return 401/403.
