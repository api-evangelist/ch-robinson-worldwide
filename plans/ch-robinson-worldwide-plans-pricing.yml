description: 'C.H. Robinson publishes no per-call price list for its Navisphere REST APIs. Two access tracks
  exist and they price differently. Carrier API connectivity is stated to be FREE: the carrier connectivity
  page says carriers ''use free application programming interface (API) connectivity to find, offer, book,
  and auto-create C.H. Robinson loads directly in your own TMS'' at ''no additional cost''. Customer/shipper
  API access is bundled into the commercial brokerage or Navisphere TMS relationship and is negotiated, not
  listed; onboarding begins with the Customer_Integration document rather than a signup form. The Labels product
  additionally requires a parcel carrier account configured in Navisphere by a C.H. Robinson or TMC representative.'
notes: No public API price list. Carrier access is free and contractual; customer access is bundled into the
  freight/TMS agreement. Verified 2026-09-05 against the provider's own pages - not inferred.
