  - https://www.chrobinson.com/en-us/
plans:
  - id: ch-robinson-worldwide-shipper
    name: Shipper API Access
    type: enterprise
    description: API access for shippers using Navisphere services (quoting, booking, tracking, documents,
      payment). Provided as part of the commercial brokerage relationship.
    entries:
      - label: Shipper integration
        name: shipper_integration
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contract
        userMultiplied: false
    elements:
      - name: Quoting and booking
      - name: Shipment tracking and visibility
      - name: Documents and freight payment
  - id: ch-robinson-worldwide-carrier
    name: Carrier API Access
    type: enterprise
    description: API access for contracted carriers covering loads, booking, status updates, documents,
      and settlement.
    entries:
      - label: Carrier integration
        name: carrier_integration
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contract
        userMultiplied: false
    elements:
      - name: Load offers and booking
      - name: Status updates and visibility
      - name: Documents and settlement
