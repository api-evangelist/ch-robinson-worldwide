description: C.H. Robinson exposes shipper, carrier, and visibility APIs through its Navisphere developer
  portal. API access is gated to active C.H. Robinson customers and contracted carriers; pricing is
  bundled with the underlying freight, brokerage, and TMS services rather than published as a separate
  per-call rate card.
notes: No public API price list. Access is contractual and tied to existing shipper/carrier relationships.
sources:
