plans:
- id: ch-robinson-worldwide-shipper
  name: Shipper API Access
  type: enterprise
  description: API access for customers/shippers using Navisphere services - rating, orders and booking, events,
    visibility, documents, financials and labels. Priced inside the brokerage / TMS agreement; no separate
    per-call rate card is published.
  entries:
  - label: Shipper integration
    name: shipper_integration
    type: subscription
    metric: contract
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: contract
    userMultiplied: false
  elements:
  - name: Quoting and booking
  - name: Shipment tracking and visibility
  - name: Documents and freight payment
  price: contract
- id: ch-robinson-worldwide-carrier
  name: Carrier API Access
  type: enterprise
  description: API access for contracted carriers covering available-shipment search, offers, load booking,
    milestone/status updates, document upload and payment status. C.H. Robinson states carrier API connectivity
    is provided free of charge; a carrier agreement and issued credentials are still prerequisites.
  entries:
  - label: Carrier integration
    name: carrier_integration
    type: subscription
    metric: contract
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: free
    userMultiplied: false
  elements:
  - name: Load offers and booking
  - name: Status updates and visibility
  - name: Documents and settlement
  price: free
