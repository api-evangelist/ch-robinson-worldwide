        in: path
        description: The document ID that links to image. documentId is retrieved using our retrieveDocumentIds route.
        required: true
        schema:
          type: integer
      x-code-samples:
      - lang: Curl
        source: "curl -X GET \\ \n https://sandbox-api.navisphere.com/v1/documents/862077900 \\ \n -H 'Authorization: Bearer YOU TOKEN' \\ \n -H 'Content-Type: application/json'"
      - lang: Java
        source: "HttpResponse<String> response = Unirest.get(\"https://sandbox-api.navisphere.com/v1/documents/862077900\") \n .header(\"Content-Type\", \"application/json\") \n .header(\"Authorization\", \"Bearer YOU TOKEN\") \n .asString();"
      - lang: NodeJS
        source: " var request = require(\"request\"); \n\n\nvar options = { method: 'GET', \n url: 'https://sandbox-api.navisphere.com/v1/documents/862077900',\n headers: { \n \tAuthorization: 'Bearer YOU TOKEN',\n \t'Content-Type': 'application/json'\n }};\n\n request(options, function (error, response, body) {\n \tif (error) throw new Error(error);\n\n \tconsole.log(body);\n });"
      - lang: C#
        source: " var client = new RestClient(\"https://sandbox-api.navisphere.com/v1/documents/862077900\"); \n var request = new RestRequest(Method.GET);\n request.AddHeader(\"Authorization\", \"Bearer YOU TOKEN\");\n request.AddHeader(\"Content-Type\", \"application/json\");\n IRestResponse response = client.Execute(request);"
      responses:
        '200':
          description: Request successful. **Multiple file formats that can be returned.**
