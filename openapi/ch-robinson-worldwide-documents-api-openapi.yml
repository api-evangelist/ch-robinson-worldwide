  /events/LoadDocuments/here:
    servers:
    - url: https://yourserver.com
      description: partner defined endpoint for documents
    post:
      security:
      - bearerAuth: []
      description: This is the endpoint where load documents can be pushed.
      x-beta: true
      operationId: Load Documents Callback
      tags:
      - Documents
      requestBody:
        description: JSON object of Load Detail message.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loadDocumentCallback'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
      summary: Load documents callback
      x-summary-source: derived
  /v1/documents/{loadNumber}:
    post:
      description: Both base64 and binary can be accepted by making a selection in the dropdown next to "Request Body Schema". Binary is form-data, base64 is application/json.
      operationId: Carrier Document Upload
      x-tryit: false
      tags:
      - Documents
      parameters:
      - name: loadNumber
        in: path
        description: The C.H. Robinson load number the document will be tied too.
        required: true
        schema:
          type: integer
      requestBody:
        description: File upload.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - docType
              properties:
                file:
                  type: string
                  description: Max file size is 40 MB.
                  format: binary
                docType:
                  $ref: '#/components/schemas/docTypeEnum'
          application/json:
            schema:
              type: object
              required:
              - fileName
              - mimeType
              - data
              - docType
              properties:
                fileName:
                  type: string
                  description: Name of the file.
                mimeType:
                  type: string
                  description: MIME type of the file.
                  enum:
                  - application/pdf
                  - image/tiff
                  - image/jpeg
                  - image/png
                  - image/gif
                  - image/bmp
                data:
                  type: string
                  description: Base64 encoded file data. Max file size is 40 MB.
                docType:
                  $ref: '#/components/schemas/docTypeEnum'
      x-code-samples:
      - lang: Curl
        source: "curl -X POST \\ \n 'https://sandbox-api.navisphere.com/v1/documents/20015434520' \\ \n -H 'Authorization: Bearer YOU TOKEN' \\ \n -H 'Content-Type: multipart/form-data'"
      - lang: Java
        source: "HttpResponse<String> response = Unirest.post(\"https://sandbox-api.navisphere.com/v1/documents/20015434520\")\n .header(\"Content-Type\", \"multipart/form-data\")\n .header(\"Authorization\", \"Bearer YOU TOKEN\")\n .asString();"
      - lang: NodeJS
        source: " const request = require(\"request\");\n const fs = require(\"fs\"); \n\n var options = { method: 'POST',\n url: 'https://sandbox-api.navisphere.com/v1/documents/20015434520',\n headers: { \n \tAuthorization: 'Bearer YOU TOKEN',\n \tContent-Type: 'multipart/form-data' \n }, \n formData: { \tdocType: 'BOL'\n \tfile: fs.createReadStream(\"/Users/guest/Desktop/test.png\"); \n }};\n\n request(options, function (error, response, body) {\n \tif (error) throw new Error(error);\n\n \tconsole.log(body);\n });"
      - lang: C#
        source: " var client = new RestClient(\"https://sandbox-api.navisphere.com/v1/documents/20015434520\");\n var request = new RestRequest(Method.POST);\n request.AddHeader(\"Authorization\", \"Bearer YOU TOKEN\");\n request.AddHeader(\"Content-Type\", \"multipart/form-data\");\n IRestResponse response = client.Execute(request);"
      responses:
        '201':
          description: Request successful
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error401'
        '403':
          description: Forbidden
          content:
