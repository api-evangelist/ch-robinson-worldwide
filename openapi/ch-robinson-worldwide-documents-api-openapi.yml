    loadDocumentCallback:
      type: object
      description: Object containing the search event response.
      properties:
        billToReferenceNumber:
          type: string
          description: Primary bill to reference number
        customerReferenceNumber:
          type: string
          description: Primary customer reference number
        event:
          type: object
          description: Object containing document saved detail
          properties:
            billTos:
              type: array
              description: Array containing bill to entities and references by customerCode
              items:
                type: object
                properties:
                  customerCode:
                    type: string
                    description: CHR defined Bill to customerCode
                  referenceNumbers:
                    description: Array containing bill to references
                    items:
                      $ref: '#/components/schemas/referenceNumber'
            customer:
              type: array
              description: Array containing customer entities and references by customerCode
              items:
                type: object
                properties:
                  customerCode:
                    type: string
                    description: CHR defined customer code
                  referenceNumbers:
                    description: Array containing customer references
                    items:
                      $ref: '#/components/schemas/referenceNumber'
            documentFileName:
              type: string
              description: Filename and extension of the carrier document
            documentType:
              type: string
              enum:
              - BOL
              - POD
              - LUMPER
              - INTL_BOL
              - INTL_POD
              description: Defines type of carrier document, such as POD (Proof of Delivery), BOL (Bill of Lading), LMP (Lumper Receipt) - see enums
            eventType:
              type: string
              description: DOCUMENT SAVED
            loadNumber:
              type: string
              description: CHR load number
        eventTime:
          type: string
          format: date-time
          description: The date/time in ISO8601 UTC format when the event was reported to have occured.
        time:
          type: string
          format: date-time
          description: The date/time in ISO8601 UTC format when the event was written to the Enterprise API database.
        documentFileData:
          type: object
          description: Object containing image byte array and contentType
          properties:
            document:
              type: string
              description: Base64 encoded carrier document
            contentType:
              type: string
              description: String showing Content-type of the document, such as application/pdf
              enum:
              - application/pdf
              - application/tif
              - application/jpeg
