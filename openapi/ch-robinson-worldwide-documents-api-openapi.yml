openapi: 3.2.0
info:
  version: 2.0.0
  title: A guide to C.H. Robinson's REST Documents API
  description: '# Introduction

    Welcome to C.H.'
servers:
- url: https://sandbox-api.navisphere.com
  description: Test environment.
- url: https://api.navisphere.com
  description: Production environment.
security:
- sandbox: []
tags:
- name: Documents
  description: C.H. Robinson's Documents product allows our partners to generate, post, and retrieve documents. C.H. Robinson currently offers customers the ability to generate blank BOLs and retrieve signed BOLs, PODs, and Lumper receipts. Additionally, carriers can post documents to their shipments.
paths:
  /v1/documents/generateBols:
    get:
      description: Allows partner to generate the blank order-level BOL for the load. A load can have many orders, and this BOL would reflect the individual order details. This route is intended to be called once the customer retrieves the `LOAD BOOKED` event from the Events product. This route produces the original "Generated BOL Retrieval" that provides a BOL for a single order on any shipment.
      operationId: GENERATED BOL RETRIEVAL - Order Level
      tags:
      - Documents
      parameters:
      - name: loadNumber
        in: query
        description: The load number that the BOL is associated with.
        required: true
        schema:
          type: integer
      - name: customerCode
        in: query
        description: The customer code that is linked to the load number.
        required: true
        schema:
          type: string
      - name: orderNumber
        in: query
        description: The order number that the load is associated with.
        required: true
        schema:
          type: integer
      - name: showItemNotes
        in: query
        description: Show item notes on the BOL.
        schema:
          type: boolean
          default: false
      x-code-samples:
      - lang: Curl
        source: "curl -X GET \\ \n https://sandbox-api.navisphere.com/v1/documents/generateBols?loadNumber=1234567&customerCode=C123456&orderNumber=123456 \\ \n -H 'Authorization: Bearer YOU TOKEN' \\ \n -H 'Content-Type: application/json'"
      - lang: Java
        source: "HttpResponse<String> response = Unirest.get(\"https://sandbox-api.navisphere.com/v1/documents/generateBols?loadNumber=1234567&customerCode=C123456&orderNumber=123456\") \n .header(\"Content-Type\", \"application/json\") \n .header(\"Authorization\", \"Bearer YOU TOKEN\") \n .asString();"
      - lang: NodeJS
        source: " var request = require(\"request\"); \n\n\nvar options = { method: 'GET', \n url: 'https://sandbox-api.navisphere.com/v1/documents/generateBols?loadNumber=1234567&customerCode=C123456&orderNumber=123456',\n headers: { \n \tAuthorization: 'Bearer YOU TOKEN',\n \t'Content-Type': 'application/json'\n }};\n\n request(options, function (error, response, body) {\n \tif (error) throw new Error(error);\n\n \tconsole.log(body);\n });"
      - lang: C#
        source: " var client = new RestClient(\"https://sandbox-api.navisphere.com/v1/documents/generateBols?loadNumber=1234567&customerCode=C123456&orderNumber=123456\"); \n var request = new RestRequest(Method.GET);\n request.AddHeader(\"Authorization\", \"Bearer YOU TOKEN\");\n request.AddHeader(\"Content-Type\", \"application/json\");\n IRestResponse response = client.Execute(request);"
      responses:
        '201':
          description: Request successful
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error404'
        '500':
          description: Internal Server Error. Please contact your C.H. Robinson rep.
      summary: GENERATED BOL RETRIEVAL order level
      x-summary-source: derived
  /v1/documents/generateLoadBols:
    get:
      description: Allows partner to generate the blank load-level BOL for the shipment. This BOL would reflect load details. A load can have many orders. The load-level BOL may also contain API-retrieved end-carrier pro number and barcode, useful in LTL operations, tracking, and billing. This route is intended to be called once the customer retrieves the `LOAD BOOKED` or `PRO NUMBER ADDED` event from the Events product.
      operationId: GENERATED BOL RETRIEVAL - Load Level
      tags:
      - Documents
      parameters:
      - name: loadNumber
        in: query
        description: The load number that the BOL is associated with.
        required: true
        schema:
          type: integer
      - name: customerCode
        in: query
        description: The customer code that is linked to the load number.
        required: true
        schema:
          type: string
      - name: orderNumber
        in: query
        description: The order number that the load is associated with.
        required: true
        schema:
          type: integer
      - name: showItemNotes
        in: query
        description: Show item notes on the BOL.
        schema:
          type: boolean
          default: false
      - name: barcodeType
        in: query
        description: Show the barcode in different format types.
        schema:
          default: UNKNOWN
          enum:
          - UNKNOWN
          - CODE39
          - CODE128
          type: string
      - name: barcodeIdentifier
        in: query
        description: What the barcode will have as an Identifier.
        schema:
          type: string
          default: UNKNOWN
          enum:
          - UNKNOWN
          - LoadNumber
          - ProNumber
          - BillToReferenceNumber
      - name: showBarcode
        in: query
        description: Show barcode on the BOL.
        schema:
          type: boolean
          default: false
      - name: responseFileType
        in: query
        description: Defines the desired BOL file type. ZIP format is required if multiple documents are expected. PDF format is only capable of returning a single BOL page, and will error if there are multiple documents. It is recommended to set responseFileType to ZIP at all times if multi-stop is a possibility.
        schema:
          type: string
          default: application/pdf
          enum:
          - application/pdf
          - application/zip
      x-code-samples:
      - lang: Curl
        source: "curl -X GET \\ \n https://sandbox-api.navisphere.com/v1/documents/generateLoadBols?loadNumber=1234567&customerCode=C123456&orderNumber=123456 \\ \n -H 'Authorization: Bearer YOU TOKEN' \\ \n -H 'Content-Type: application/json'"
      - lang: Java
        source: "HttpResponse<String> response = Unirest.get(\"https://sandbox-api.navisphere.com/v1/documents/generateLoadBols?loadNumber=1234567&customerCode=C123456&orderNumber=123456\") \n .header(\"Content-Type\", \"application/json\") \n .header(\"Authorization\", \"Bearer YOU TOKEN\") \n .asString();"
      - lang: NodeJS
        source: " var request = require(\"request\"); \n\n\nvar options = { method: 'GET', \n url: 'https://sandbox-api.navisphere.com/v1/documents/generateLoadBols?loadNumber=1234567&customerCode=C123456&orderNumber=123456',\n headers: { \n \tAuthorization: 'Bearer YOU TOKEN',\n \t'Content-Type': 'application/json'\n }};\n\n request(options, function (error, response, body) {\n \tif (error) throw new Error(error);\n\n \tconsole.log(body);\n });"
      - lang: C#
        source: " var client = new RestClient(\"https://sandbox-api.navisphere.com/v1/documents/generateLoadBols?loadNumber=1234567&customerCode=C123456&orderNumber=123456\"); \n var request = new RestRequest(Method.GET);\n request.AddHeader(\"Authorization\", \"Bearer YOU TOKEN\");\n request.AddHeader(\"Content-Type\", \"application/json\");\n IRestResponse response = client.Execute(request);"
      responses:
        '201':
          description: Request successful
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error404'
        '500':
          description: Internal Server Error. Please contact your C.H. Robinson rep.
      summary: GENERATED BOL RETRIEVAL load level
      x-summary-source: derived
