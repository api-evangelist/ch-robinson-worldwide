    availableShipmentsSearchV2:
      type: object
      required:
      - regionCode
      properties:
        pageIndex:
          type: integer
          description: Sets the page of results.
          default: 0
        pageSize:
          type: integer
          description: Sets the amount of results on the page.
          maximum: 100
          default: 100
        regionCode:
          type: string
          description: Indicates the region code for the request.
          enum:
          - NA
          - EU
        carrierCode:
          type: string
          description: C.H. Robinson define code that identifies a carrier.
        originRadiusSearch:
          $ref: '#/components/schemas/radiusSearch'
        destinationRadiusSearch:
          $ref: '#/components/schemas/radiusSearch'
        origins:
          type: array
          description: Indicates the country and state(s) to be considered for the origin. Only use this if originRadiusSearch isn't being used.
          items:
            type: object
            required:
            - countryCode
            - stateCodes
            properties:
              countryCode:
                type: string
                description: Indicate the country code.
              stateCodes:
                type: array
                description: Indicate state code(s) wanting to be considered.
                items:
                  type: string
        destinations:
          type: array
          description: Indicates the country and state(s) to be considered for the destination. Only use this if destinationRadiusSearch isn't being used.
          items:
            type: object
            required:
            - countryCode
            - stateCodes
            properties:
              countryCode:
                type: string
                description: Indicate the country code.
              stateCodes:
                type: array
                description: Indicate state code(s) wanting to be considered.
                items:
                  type: string
        modes:
          $ref: '#/components/schemas/availableShipmentsModeEnum'
        excludedModes:
          $ref: '#/components/schemas/availableShipmentsModeEnum'
        loadDistanceRange:
          type: object
          required:
          - unitOfMeasure
          - min
          - max
          description: Indicates min/max distance wanted.
          properties:
            unitOfMeasure:
              $ref: '#/components/schemas/unitOfMeasure'
            min:
              type: integer
              description: Minimum distance desired.
            max:
              type: integer
              description: Maximum distance desired.
        loadWeightRange:
          type: object
          required:
          - unitOfMeasure
          - min
          - max
          description: Indicates min/max weight wanted.
          properties:
            unitOfMeasure:
              $ref: '#/components/schemas/unitOfMeasure'
            min:
              type: integer
              description: Minimum weight desired.
            max:
              type: integer
              description: Maximum weight desired.
        equipmentLengthRange:
          type: object
          required:
          - unitOfMeasure
          - min
          - max
          description: Indicates min/max equipment length wanted.
          properties:
            unitOfMeasure:
              $ref: '#/components/schemas/unitOfMeasure'
            min:
              type: integer
              description: Minimum length desired.
            max:
              type: integer
              description: Maximum length desired.
        availableForPickUpByDateRange:
          type: object
          description: Set earliest and latest date window for a load to be ready by.
          properties:
            min:
              type: string
              format: date
              description: An ISO8601 UTC date used to indicate the earliest ready by date.
            max:
              type: string
              format: date
              description: An ISO8601 UTC date used to indicate the latest ready by date.
        specializedEquipmentCode:
          description: Depending on the region code you will use a code from one of the lists below.
          oneOf:
          - $ref: '#/components/schemas/specializedEquipmentCodeNAEnum'
          - $ref: '#/components/schemas/specializedEquipmentCodeEUEnum'
        teamLoad:
          type: boolean
          description: Indicate if team loads are returned in results alongside non-teamLoad loads. If exluding these types of loads is desired, "false" must be sent.
          default: true
        stfLoad:
          type: boolean
          description: Indicate if STF loads are returned in results alongside non-STF loads. If exluding these types of loads is desired, "false" must be sent.
          default: true
        hazMatLoad:
          type: boolean
          description: Indicate if Hazmat loads are returned in results alongside non-hazmat loads. If exluding these types of loads is desired, "false" must be sent.
          default: true
        tankerLoad:
          type: boolean
          default: true
          description: Indicate if Tanker loads are returned in results alongside non-tanker loads. If exluding these types of loads is desired, "false" must be sent.
        chemicalSolutionLoad:
          type: boolean
          description: Indicate if Chemical Solution loads are returned in results alongside non-Chemical solution loads. If exluding these types of loads is desired, "false" must be sent.
          default: true
        highValueLoad:
          type: boolean
          description: Indicate if High Value loads are returned in results alongside non-High value loads. If exluding these types of loads is desired, "false" must be sent.
          default: true
        sortCriteria:
          type: object
          description: Allows user to sort results.
          required:
          - field
          - direction
          properties:
            field:
              type: string
              description: Selection the criteria for sorting results.
              enum:
              - LoadNumber
              - OriginCity
              - CalculatedPickupByDateTime
              - Distance
              - DestinationCity
              - CalculatedDeliverByDateTime
              - Weight
              - Mode
              - OriginDeadHeadDistance
            direction:
              type: string
              description: Select either Ascending or Descending.
              enum:
              - ascending
              - descending
    loadBookV2:
      type: object
      description: JSON payload to book a carrier to an available shipment.
      required:
      - loadNumber
      - carrierCode
      - emailAddress
      - availableLoadCosts
      - rateConEmail
      - rateConName
      properties:
        loadNumber:
          type: integer
          format: base32 integer
          description: C.H. Robinson provided shipment identifier.
        carrierCode:
          type: string
          description: C.H. Robinson defined code for the carrier.
        emptyDateTime:
          type: string
          format: date-time
          description: ISO8601 UTC date-time the trailer is empty and driver is on his way to the pick up.
        emptyLocation:
          $ref: '#/components/schemas/emptyLocationV2'
        availableLoadCosts:
          type: array
          description: Array of the bin cost object. The fields for this object are informed by the avaialble shipments response message (availableLoadCost)
          minimum: 1
          items:
            $ref: '#/components/schemas/binCost'
        rateConfirmation:
          $ref: '#/components/schemas/rateConfirmation'
    freightTermEnum:
      type: string
      description: "Code to indicate the freight term type:\n\n* `CL` - Collect\n* `PP` - Prepaid \n* `TP` - Third Party\n* `PC` - Prepaid and Add\n* `CC` - The Bill To is paying via a Credit Card\n\n"
      enum:
      - CL
      - PP
      - TP
      - PC
      - CC
    availableShipmentsResponseV2:
      type: object
      properties:
        results:
          $ref: '#/components/schemas/availableShipmentV2'
        totalResults:
          type: integer
          description: Number of loads available from the query.
    availableShipmentEquipment:
      type: object
      properties:
        length:
          $ref: '#/components/schemas/dimension'
        width:
          $ref: '#/components/schemas/dimension'
        height:
          $ref: '#/components/schemas/dimension'
    availableShipmentLocation:
      type: object
      description: Location information.
      properties:
        warehouseCode:
          type: string
          minimum: 1
          maximum: 100
          description: C.H. Robinson defined identifier of a location.
        city:
          type: string
          minimum: 1
          maximum: 50
          description: City where load is picked up or deliverd.
        stateCode:
          type: string
          minimum: 1
          maximum: 5
          description: State where load is picked up or deliverd.
        postalCode:
          type: string
          minimum: 1
          maximum: 10
          description: State where load is picked up or deliverd.
        county:
          type: string
          minimum: 1
          maximum: 50
          description: County where load is picked up or deliverd.
        countryCode:
          type: string
          minimum: 1
          maximum: 5
          description: Country where load is picked up or deliverd.
        coordinate:
          $ref: '#/components/schemas/coordinate'
        openTime:
          type: string
          description: The time the location opens as defined by the ISO 8601 duration standar https://en.wikipedia.org/wiki/ISO_8601#Durations.
        closeTime:
          type: string
          description: The time the location closes defined by the ISO 8601 duration standar https://en.wikipedia.org/wiki/ISO_8601#Durations.
