      - lang: Curl
        source: "curl -X POST \\ \n 'https://sandbox-api.navisphere.com/v1/shipments/milestones' \\ \n -H 'Authorization: Bearer YOU TOKEN' \\ \n -H 'Content-Type: application/json' \n -d '{ \t\"eventCode\": \"X3\",\n \t\"shipmentIdentifier\": {\n \t\t\"shipmentNumber\": \"123456789\",\n \t\t\"shipperBillToId\": \"123456789\",\n \t\t\"proNumber\": \"PRO512461\",\n \t\t\"trackingNumber\": \"1Z1245132579423\",\n \t\t\"containerNumber\": \"HBJ51423\" \n \t }, \n \t\"dateTime\": {\n \t\t\"eventDateTime\": \"2019-06-05T18:36:13.131Z\",\n \t\t\"estimatedTimeOfArrival\": \"2019-06-05T18:36:13.131Z\",\n \t\t\"appointmentWindow\": {\n \t\t\t\"openDateTime\": \"2019-06-05T18:36:13.131Z\",\n \t\t\t\"closeDateTime\": \"2019-06-05T18:36:13.131Z\"\n \t\t } \n \t }, \n \t\"carrier\": {\n \t\t\"name\": \"Test Carrier\",\n \t\t\"dotNumber\": \"Test\",\n \t\t\"scac\": \"RBTW\",\n \t\t\"temperature\": 32,\n \t\t\"temperatureUnitOfMeasure\": \"Fahrenheit\",\n \t\t\"vehicleDetail\": {\n \t\t\t\"tractorNumber\": \"375\",\n \t\t\t\"trailerNumber\": \"PV5346\",\n \t\t\t\"licensePlate\": \"MCV246\",\n \t\t\t\"licensePlateState\": \"MN\",\n \t\t\t\"vin\": \"1HGBH41JXMN109186\",\n \t\t\t\"contactInformation\": {\n \t\t\t\t\"driverName\": \"Red Barkley\",\n \t\t\t\t\"driverPhone\": \"5556129457\",\n \t\t\t\t\"secondDriverName\": \"Lincoln Hawk\",\n \t\t\t\t\"secondDriverPhone\": \"5554843167\",\n \t\t\t\t\"dispatchName\": \"Kylo Ren\",\n \t\t\t\t\"dispatchPhone\": \"5558675309\"\n \t\t\t } \n \t\t } \n \t }, \n \t\"location\": {\n \t\t\"type\": \"drop\",\n \t\t\"stopSequenceNumber\": 2,\n \t\t\"sequenceNumber\": 1,\n \t\t\"name\": \"Bulk Goods Warehouse\",\n \t\t\"locationId\": \"W4875164\",\n \t\t\"address\": {\n \t\t\t\"address1\": \"14800 Charlson Rd\",\n \t\t\t\"address2\": \"Building 1\",\n \t\t\t\"city\": \"Eden Prairie\",\n \t\t\t\"latitude\": 44.820538,\n \t\t\t\"longitude\": -93.464427,\n \t\t\t\"stateProvinceCode\": \"MN\",\n \t\t\t\"postalCode\": \"55347\",\n \t\t\t\"country\": \"US