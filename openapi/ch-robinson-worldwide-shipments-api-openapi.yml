            type: boolean
            description: Are personal protective equipment required.
          hasOverDimensionalItems:
            type: boolean
            description: has over dimensional items
          isHeavyHaul:
            type: boolean
            description: is a heavy haul
          load_join:
            type: string
            description: load join
          createdDateTime:
            type: string
            format: date
            description: An ISO8601 UTC date-time.
          updatedDateTime:
            type: string
            format: date
            description: An ISO8601 UTC date-time.
          assignedRep:
            type: string
            description: The Rep assigned.
          calculatedPickUpByDateTime:
            type: string
            format: date
            description: An ISO8601 UTC date-time.
          calculatedDeliverByDateTime:
            type: string
            format: date
            description: An ISO8601 UTC date-time.
    temperatureUomEnum:
      type: string
      description: Unit of measure for temperature parameters.
      enum:
      - Fahrenheit
      - Celsius
      - Empty
    loadOffer:
      type: object
      description: Object to use for submitting load offer.
      required:
      - carrierCode
      - offerPrice
      properties:
        carrierCode:
          type: string
          description: C.H. Robinson defined code for the carrier making the offer.
        offerPrice:
          type: integer
          description: Amount carrier would like to offer on the load.
        offerNote:
          type: string
          description: Any note the carrier would like to send along with the offer.
        currencyCode:
          type: string
