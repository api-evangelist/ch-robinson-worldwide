components:
  schemas:
    milestoneLocation:
      type: object
      description: Location information associated to the milestone.
      required:
      - address
      properties:
        type:
          $ref: '#/components/schemas/milestoneStoptypeEnum'
        stopSequenceNumber:
          type: integer
          description: "Identifies the stop number the milestone is associated to. \n\n ### <span style=\"color:DeepPink\">If location is for a milestone that isn't tied to a stop then this field should be set to null.</span>"
        sequenceNumber:
          type: integer
          description: "Identifies the sequence number the milestone is associated to. \n\n ### <span style=\"color:DeepPink\">If location is for a milestone that isn't tied to a stop then this field should be set to null.</span>"
        name:
          type: string
          description: Identifies the name of the location the milestone is associated to. If location is for a milestone that isn't tied to a stop then this field should be set to null.
        locationId:
          type: string
          description: Milestone location identifier.
        unlocationCode:
          type: string
          description: The UN Location Code for the milestone location.
          minimum: 1
          maximum: 10
        iata:
          type: string
          description: The IATA code for the milestone location.
        address:
          $ref: '#/components/schemas/milestoneLocationAddress'
    availableShipmentsRateEnum:
      type: string
      description: 'C.H. Robinson defined rate code.


        For a detailed description of all enumerated codes please find them <a href="https://api.navisphere.com/api/B2B/Portal/v1/documents/descriptions/AvailableShipmentsRateCodeDescriptions.xlsx" target="_blank">here</a>.'
      enum:
      - C
      - CPU
      - CRI
      - CS
      - D
      - DE
      - E
      - FBL
      - FP
      - H
      - HV
      - IC
      - N
      - ND
      - P
      - S
      - SD
