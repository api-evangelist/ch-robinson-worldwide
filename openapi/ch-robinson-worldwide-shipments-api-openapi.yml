          minimumLogipoints:
            type: number
            format: float
          availableLoadCosts:
            type: array
            description: Array of load costs
            items:
              $ref: '#/components/schemas/availableLoadCost'
          deadHeadDistance:
            type: number
            description: Deadhead mileage from search origin to load origin.
          reeferSetting:
            type: string
            description: Indicates the reefer setting.
          reeferTemperature:
            $ref: '#/components/schemas/availableShipmentTemperature'
          maxTemp:
            $ref: '#/components/schemas/availableShipmentTemperature'
          minTemp:
            $ref: '#/components/schemas/availableShipmentTemperature'
          availableForPickUp:
            type: object
