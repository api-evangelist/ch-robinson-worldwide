    dateTime:
      type: object
      description: "Object containing the different types of dates that can apply to a milestone. \n\n ### <span style=\"color:DeepPink\">At least one needs to be present.</span>"
      properties:
        eventDateTime:
          type: string
          format: date-time
          description: ISO8601 UTC date-time of the milestone for event code not pertaining to ETA or appointment.
        estimatedTimeOfArrival:
          type: string
          format: date-time
          description: ISO8601 UTC date-time when event code pertains to ETA.
        appointmentWindow:
          type: object
          description: The date/time window when an appointment has been set. If there is no window, put the same date/time in both the openDateTime and closeDateTime fields.
          properties:
            openDateTime:
              type: string
              format: date-time
              description: ISO8601 UTC date-time of earliest time carrier will be arriving.
            closeDateTime:
              type: string
              format: date-time
              description: ISO8601 UTC date-time of latest time carrier will be arriving.
    availableLoadCost:
      type: object
      description: Object containing load cost.
      properties:
        loadNumber:
          type: integer
          description: C.H. Robinson shipment number.
        carrierCode:
          type: string
          description: C.H. Robinson carrier identifier.
        expirationDate:
          type: string
          format: date
          description: An ISO8601 UTC date-time used to indicate the expiration date of the cost.
        type:
          type: string
          description: Indicates the type of cost.
        code:
          $ref: '#/components/schemas/rateCodeEnum'
        description:
          type: string
          description: Cost description.
        sourceCostPerUnit:
          type: number
          description: Amount of cost by unit. To derive total cost take sourceCostPerUnit and multiply by units.
        units:
          type: number
          description: Count of the cost.
        currencyCode:
          $ref: '#/components/schemas/currencyCodeEnum'
        employeeCode:
          type: string
          description: C.H. Robinson employee identifier.
        employeeBranch:
          type: integer
          description: C.H. Robinson employee branch identifier.
        score:
          type: number
          description: Score
        createdDateTime:
          type: string
          format: date
          description: An ISO8601 UTC date-time used to indicate the creation date of the cost.
        updatedDateTime:
          type: string
          format: date
          description: An ISO8601 UTC date-time used to indicate the updated date of the cost.
        binCostKey:
          type: string
          description: C.H. Robinson generate GUID.
        binOfferable:
          type: boolean
          description: Indicates if this is available for offer.
    error404:
      required:
      - statusCode
      - error
      - message
      properties:
        statusCode:
          type: integer
          description: Error code
          example: 404
        error:
          type: string
          description: Detail about the error status code
          example: Not Found
        message:
          type: string
          description: Specifies issue
          example: Not Found
    supplementalInformation:
      type: object
      description: Allows updating entity to provide additional details pertaining to the milestone.
      properties:
        reasonCode:
          $ref: '#/components/schemas/lateCodeEnum'
        notes:
          type: string
          description: Allows updating entity to provide any notations pertaining to the milestone.
    milestone:
      type: object
      description: Shipment update
      required:
      - eventCode
      - dateTime
      - shipmentIdentifier
      - location
      properties:
        transitType:
          description: Defines the type of movement the event is for.
          enum:
          - Road
          - Ocean
          - Rail
          - Air
        eventCode:
          description: Depending on the transitType you will use a code from one of the lists below.
          oneOf:
          - $ref: '#/components/schemas/roadMilestoneEventCodeEnum'
          - $ref: '#/components/schemas/oceanMilestoneEventCodeEnum'
          - $ref: '#/components/schemas/railMilestoneEventCodeEnum'
          - $ref: '#/components/schemas/airMilestoneEventCodeEnum'
        shipmentIdentifier:
          $ref: '#/components/schemas/shipmentIdentifier'
        dateTime:
          $ref: '#/components/schemas/dateTime'
        carrier:
          $ref: '#/components/schemas/milestoneCarrier'
        location:
          $ref: '#/components/schemas/milestoneLocation'
        items:
          type: array
          description: Array of items tied to the milestone.
          items:
            $ref: '#/components/schemas/milestoneItem'
        supplementalInformation:
          $ref: '#/components/schemas/supplementalInformation'
    weight:
      type: object
      description: Total pounds and kilograms.
      properties:
        pounds:
          type: number
          format: float
          description: Total weight in pounds of the load.
        kilograms:
          type: number
          format: float
          description: Total weight in kilograms of the load.
    error400:
      properties:
        message:
          type: string
        path:
          type: array
          items:
            type: string
        type:
          type: string
        context:
          type: object
          properties:
            child:
              type: string
            value:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  value:
                    type: string
            key:
              type: string
            label:
              type: string
    vesselDetail:
      type: object
      description: Identifies vessel information.
      properties:
        vesselName:
          type: string
          description: Identifies the name of the vessel.
        voyageNumber:
          type: string
          description: Identifies the voyage number..
        vesselIMONumber:
          type: string
          description: Identifies vessel IMO number.
        hullNumber:
          type: string
          description: Identifies the hull number of the vessel.
    availableShipmentV2:
      type: array
      description: Contains the information of available loads.
      items:
        type: object
        required:
        - origin
        - destination
        properties:
          loadNumber:
            type: integer
            format: base32 integer
            description: C.H. Robinson provided shipment identifier.
          origin:
            $ref: '#/components/schemas/availableShipmentLocation'
          destination:
            $ref: '#/components/schemas/availableShipmentLocation'
          distance:
            $ref: '#/components/schemas/distance'
          weight:
            $ref: '#/components/schemas/weight'
          readyBy:
            type: string
            format: date-time
            description: An ISO8601 UTC date-time that can be set by partner to include loads available to be shipped on or before a specific date.
          deliverBy:
            type: string
            format: date-time
            description: An ISO8601 UTC date-time that can be set by the partner to include loads set to be delivered on or before a specific date.
          equipment:
            $ref: '#/components/schemas/availableShipmentEquipment'
          specializedEquipment:
            allOf:
            - type: object
              properties:
                code:
                  type: string
                  description: Code of specialized equipment.
                description:
                  type: string
                  description: Description of specialized equipment.
            - $ref: '#/components/schemas/availableShipmentEquipment'
          hasDriverWork:
            type: boolean
            description: Indication if work is required by the driver.
          stopCount:
            type: integer
            description: Indicates how many stops are on the shipment.
          carrierTier:
            type: string
            enum:
            - None
            - Base
            - Core
            - Key
            - DoesNotApply
            - New
            - Managed
            - ManagedBase
            description: The program, if any, the shipment is a part of.
          isOkToAdvertise:
            type: boolean
            description: Indicates if load is classified as okay to advertise.
          isDatOk:
            type: boolean
            description: Indicates if load is classified as a DAT load.
          isHazMat:
            type: boolean
            description: Indicates if load is classified as a HazMat.
          isTeamLoad:
            type: boolean
            description: Indicates if load is classified as needing a driver team.
          isRegulatedByStf:
            type: boolean
            description: Indicates if load is classified as STF regulated.
          isTankerEndorsementRequired:
            type: boolean
            description: Indicates if load is classified as needing driver to have tanker endorsement.
          isTest:
            type: boolean
            description: Indicates if load is a test load.
          isWebDisplayable:
            type: boolean
          sourceUom:
            $ref: '#/components/schemas/unitOfMeasure'
          regionCode:
            type: string
            description: Indicates region the load resides in.
          comment:
            type: string
            description: Displays, if any, comments associated to the load.
          contact:
            $ref: '#/components/schemas/availableShipmentContact'
          rating:
            $ref: '#/components/schemas/availableShipmentsRateEnum'
          modes:
            type: array
            items:
              $ref: '#/components/schemas/availableShipmentsModeEnum'
          hasDropTrailer:
            type: boolean
            description: Indicates is load is a drop trailer.
          deliveryAvailableDate:
            type: string
            format: date
            description: Indicates the date the shipment is available for delivery.
