openapi: 3.2.0
info:
  version: 2.0.0
  title: A guide to C.H. Robinson's REST Shipments API
  description: '# Introduction

    Welcome to C.H.'
servers:
- url: https://sandbox-api.navisphere.com
  description: Test environment.
- url: https://api.navisphere.com
  description: Production environment.
security:
- sandbox: []
tags:
- name: Shipments
  description: C.H. Robinson's Shipments product allows our partner base to access C.H. Robinson's available shipments, send offers on those shipments, and book those shipments. Additionally, our partners can update C.H. Robinson on any shipments that C.H. Robinson is responsible for, as well as view status of payment.
paths:
  /v2/shipments/available/searches:
    post:
      description: Allows partner to retrieve list summary of shipments available for transportation.
      operationId: Available Shipment Search
      tags:
      - Shipments
      requestBody:
        description: Returns a list of available shipments.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/availableShipmentsSearchV2'
            examples:
              RequestByRadius:
                value:
                  pageIndex: 0
                  pageSize: 100
                  regionCode: NA
                  modes:
                  - V
                  - R
                  originRadiusSearch:
                    coordinate:
                      lat: 37.775
                      lon: -122.41833
                    radius:
                      value: 1000
                      unitOfMeasure: Standard
                  destinationRadiusSearch:
                    coordinate:
                      lat: 37.775
                      lon: -122.41833
                    radius:
                      value: 1000
                      unitOfMeasure: Standard
                  loadDistanceRange:
                    unitOfMeasure: Standard
                    min: 0
                    max: 5000
                  loadWeightRange:
                    unitOfMeasure: Standard
                    min: 0
                    max: 48000
                  equipmentLengthRange:
                    unitOfMeasure: Standard
                    min: 0
                    max: 53
                  availableForPickUpByDateRange:
                    min: '2021-06-29'
                    max: '2021-06-30'
                  teamLoad: true
                  stfLoad: true
                  hazMatLoad: true
                  tankerLoad: true
                  chemicalSolutionLoad: true
                  highValueLoad: true
                  sortCriteria:
                    field: LoadNumber
                    direction: ascending
              RequestByStates:
                value:
                  pageIndex: 0
                  pageSize: 100
                  regionCode: NA
                  excludedModes:
                  - B
                  origins:
                  - countryCode: US
                    stateCodes:
                    - CA
                    - MN
                    - GA
                    - IA
                  destinations:
                  - countryCode: US
                    stateCodes:
                    - CA
                    - MN
                    - GA
                    - IA
                  loadDistanceRange:
                    unitOfMeasure: Standard
                    min: 0
                    max: 5000
                  loadWeightRange:
                    unitOfMeasure: Standard
                    min: 0
                    max: 48000
                  equipmentLengthRange:
                    unitOfMeasure: Standard
                    min: 0
                    max: 53
                  availableForPickUpByDateRange:
                    min: '2021-06-29'
                    max: '2021-06-30'
                  teamLoad: true
                  stfLoad: true
                  hazMatLoad: true
                  tankerLoad: true
                  chemicalSolutionLoad: true
                  highValueLoad: true
                  sortCriteria:
                    field: LoadNumber
                    direction: ascending
      responses:
        '200':
          description: The available shipments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/availableShipmentsResponseV2'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error404'
        '500':
          description: Internal Server Error. Please contact your C.H. Robinson rep.
      summary: Available shipment search
      x-summary-source: derived
  /v1/shipments/{loadNumber}/offers:
    post:
      description: Allows carrier to submit an offer on a load found through the Available Shipment search if load has associated availableLoadCost(s).
      x-beta: true
      operationId: Load Offer
      tags:
      - Shipments
      parameters:
      - in: path
        name: loadNumber
        schema:
          type: integer
        required: true
      requestBody:
        description: JSON object of offer request.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loadOffer'
            example:
              carrierCode: T100
              offerPrice: 500
              offerNote: Note goes here
              currencyCode: USD
              availableLoadCost: 600
      responses:
        202:
          description: Request successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/offerAcknowledgment'
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error400'
              example:
              - message: '"referenceNumber" is not allowed'
                path:
                - referenceNumber
                type: object.allowUnknown
                context:
                  child: referenceNumber
                  value:
                  - type: MBOL
                    value: MBOL12345
                  key: referenceNumber
                  label: referenceNumber
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/error401'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error403'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error404'
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error422'
        500:
          description: Internal Server Error. Please contact your C.H. Robinson Rep.
      summary: Load offer
      x-summary-source: derived
  /offerResponse/callback/here:
    servers:
    - url: https://yourserver.com
      description: partner defined endpoint
    post:
      security:
      - bearerAuth: []
      description: This is the endpoint on your server where we will send the offer response for loads you have made offers on.
      x-beta: true
      operationId: Offer Response Callback
      tags:
      - Shipments
      requestBody:
        description: JSON object of Offer Response message.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/offerResponse'
      responses:
        2XX:
          description: Your server returns this code if it accepts the callback
          content:
            text/plain:
              schema:
                type: string
                example: OK
      summary: Offer response callback
      x-summary-source: derived
  /v1/shipments/books:
    post:
      description: Allows carrier to book a load found through the Available Shipment search if load has associated availableLoadCost(s).
      operationId: Load Book
      tags:
      - Shipments
      requestBody:
        description: JSON object of booking request.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loadBookV2'
            example:
              loadNumber: 102888682
              carrierCode: T100
              emptyDateTime: '2021-08-11T16:43:18.574Z'
              emptyLocation:
                city: Kansas City
                state: MO
                country: US
                zip: '64155'
              availableLoadCosts:
              - type: Flat
                code: '400'
                description: Line Haul
                currencyCode: USD
                sourceCostPerUnit: 100.95
                units: 1
              rateConfirmation:
                email: test@chrobinson.com
                name: Test User
      responses:
        202:
          description: Request successful
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error400'
              example:
              - message: '"referenceNumber" is not allowed'
                path:
                - referenceNumber
                type: object.allowUnknown
                context:
                  child: referenceNumber
                  value:
                  - type: MBOL
                    value: MBOL12345
                  key: referenceNumber
                  label: referenceNumber
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/error401'
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error403'
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error404'
        422:
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error422'
        500:
          description: Internal Server Error. Please contact your C.H. Robinson Rep.
      summary: Load book
      x-summary-source: derived
  /shipmentDetails/callback/here:
    servers:
    - url: https://yourserver.com
      description: partner defined endpoint
    post:
      security:
      - bearerAuth: []
      description: This is the endpoint on your server where we will send the shipment details for loads you have booked.
      x-beta: true
      operationId: Shipment Details Callback
      tags:
      - Shipments
      requestBody:
        description: JSON object of Load Detail message.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shipmentDetail'
      responses:
        2XX:
          description: Your server returns this code if it accepts the callback
          content:
            text/plain:
              schema:
                type: string
                example: OK
      summary: Shipment details callback
      x-summary-source: derived
  /v1/shipments/milestones:
    post:
      description: Allows carrier, vendor, or other updating entity to update C.H. Robinson on any shipment.
      operationId: Milestone Updates
      tags:
      - Shipments
      requestBody:
        description: JSON object of mileston Update.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/milestone'
            example:
              eventCode: X3
              shipmentIdentifier:
                shipmentNumber: '123456789'
                shipperBillToId: '123456789'
                proNumber: PRO512461
                trackingNumber: 1Z1245132579423
                containerNumber: HBJ51423
              dateTime:
                eventDateTime: '2019-06-05T18:36:13.131Z'
                estimatedTimeOfArrival: '2019-06-05T18:36:13.131Z'
                appointmentWindow:
                  openDateTime: '2019-06-05T18:36:13.131Z'
                  closeDateTime: '2019-06-05T18:36:13.131Z'
              carrier:
                name: Test Carrier
                dotNumber: Test
                mcNumber: MC Number
                scac: RBTW
                temperature: 32
                temperatureUnitOfMeasure: Fahrenheit
                vehicleDetail:
                  tractorNumber: '375'
                  trailerNumber: PV5346
                  licensePlate: MCV246
                  licensePlateState: MN
                  vin: 1HGBH41JXMN109186
                  contactInformation:
                    driverName: Red Barkley
                    driverPhone: '5556129457'
                    secondDriverName: Lincoln Hawk
                    secondDriverPhone: '5554843167'
                    dispatchName: Kylo Ren
                    dispatchPhone: '5558675309'
              location:
                type: drop
                stopSequenceNumber: 2
                sequenceNumber: 1
                name: Bulk Goods Warehouse
                locationId: W4875164
                address:
                  address1: 14800 Charlson Rd
                  address2: Building 1
                  city: Eden Prairie
                  latitude: 44.820538
                  longitude: -93.464427
                  stateProvinceCode: MN
                  postalCode: '55347'
                  country: US
              items:
              - itemId: '123456'
                weight: 45
                weightUnitOfMeasure: Pounds
                quantity: 12
                pallets: 1
              supplementalInformation:
                reasonCode: '1'
                notes: Truck broke its axle
