    offerResponse:
      type: object
      description: Object with response to carrier offer.
      properties:
        loadNumber:
          type: string
          description: ID of the shipment the offer was made on.
        carrierCode:
          type: string
          description: C.H. Robinson defined code for the carrier making the offer.
        offerRequestId:
          type: string
          description: Unique identifier that is associated with the offer request. This is the ID received in the response when making the offer.
        offerId:
          type: string
          description: C.H. Robinson's internal id associated to the offer.
        offerResult:
          type: string
          description: Current status of the offer. Rejected and NotConsidered can both be considered declining the offer. Counter means C.H. Robinson has countered with a new price.
          enum:
          - Accepted
          - Rejected
          - NotConsidered
          - Counter
        price:
          type: integer
          description: Price of the offer. If the offerResult is "Counter" then the price displayed is C.H. Robinson's counter offer price.
        currencyCode:
          type: string
          description: Currency code of the offer amount.
        rejectReasons:
          type: array
          description: If offer is rejected this details the reason(s).
          items:
            type: string
    availableShipmentStop:
      type: object
      properties:
        stopNumber:
          type: integer
          description: Number to indicate where in the order of stops the location is. C.H. Robinson uses a zero index. This means the \"0\" will indicate the first stop in the sequence of stops.
        sequenceNumber:
          type: integer
          description: System generated number applied to the location when it is entered into the system.
        stopType:
          type: string
          description: Stop type associated to this location.
          enum:
          - Pick
          - Drop
          - CrossDock
          - DestinationAirport
          - DestinationPort
          - DestinationTerminal
          - IntermediaryAirport
          - IntermediaryPort
          - IntermediaryRamp
          - OriginAirport
          - OriginPort
          - OriginRamp
          - OriginTerminal
        calculatedArriveByStartDateTime:
          type: string
          format: date-time
        calculatedArriveByEndDateTime:
          type: string
          format: date-time
        heavyWeight:
          type: integer
        maxWeight:
          type: integer
        warehouseInformation:
          $ref: '#/components/schemas/availableShipmentLocation'
        isScheduledOpenTimeSpecified:
          type: boolean
        isScheduledCloseTimeSpecified:
          type: boolean
