      description: "Indicates the type of contact specified:\n  * `Vendor` - Vendor party (Non Transportation Supplier)\n  * `Buyer` - Buyer Party\n  * `Contact` - Contact Party\n  * `OrderedBy` - Ordered By Party on the Order or Load\n  * `NotifyParty` - Notify Party\n  * `OnlineContact` - CHRWOnline Contact\n  * `SchedWith` - Scheduled With\n  * `POCustomer` - Customer on the Purchase Order\n"
      enum:
      - Vendor
      - Buyer
      - Contact
      - OrderedBy
      - NotifyParty
      - OnlineContact
      - SchedWith
      - POCustomer
    PartyType:
      enum:
      - Consignee
      - BillTo
      - Shipper
      - NotifyParty
      type: string
      description: Party type enumeration.
    order:
      type: object
      required:
      - customers
      - billTos
      - services
      properties:
        orderNumber:
          type: integer
          description: "C.H. Robinson order number received on successful order create.\n  ### This would only be used on an Order Update."
        customers:
          type: array
          minimum: 1
          maximum: 1
          description: The customer(s) on the order.
          items:
            $ref: '#/components/schemas/orderCustomer'
        billTos:
          type: array
          minimum: 1
          description: The bill to(s) on the order.
          items:
            $ref: '#/components/schemas/orderBillTo'
        services:
          type: array
          minimum: 1
          description: The service(s) on the order.
          items:
            $ref: '#/components/schemas/orderService'
        measurementSystem:
          type: string
          description: Indicates the unit of measure.
          enum:
          - Metric
          - Standard
        referenceNumbers:
          type: array
          description: Additional reference number objects pertaining to the whole order.
          items:
            $ref: '#/components/schemas/referenceNumber'
        additionalLocations:
          type: array
          description: List of additional Locations for Ocean/Air transport Mode.
          items:
            $ref: '#/components/schemas/additionalLocation'
        internationalParcelShippingSpecs:
          type: object
          description: Elements specific to international parcel shipping scenarios.
          properties:
            isDutiable:
              type: boolean
              description: A flag required for DHL international shipments indicating whether or not the shipment is dutiable.
            dutyPayerType:
              $ref: '#/components/schemas/payerTypeEnum'
            dutyPayerAccountNumber:
              $ref: '#/components/schemas/dutyPayerAccountNumber'
            exportReasonCode:
              $ref: '#/components/schemas/exportReasonCode'
            AESTransactionNumber:
              $ref: '#/components/schemas/AESTransactionNumber'
            isAESExempt:
              type: boolean
              description: Indicates that goods being shipped are exempt from AES Export Filing; FedEx only, Optional.
            countryOfOriginCode:
              description: Indicates country of origin of the items; Required for all international shipments.
              $ref: '#/components/schemas/countryCodeEnum'
        parcelLabelReferenceNumbers:
          type: object
          description: Reference data to be used on the label pertaining to the whole order.
          properties:
            labelReferenceData1:
              $ref: '#/components/schemas/labelReferenceData1'
            labelReferenceData2:
              $ref: '#/components/schemas/labelReferenceData2'
            labelReferenceData3:
              $ref: '#/components/schemas/labelReferenceData3'
        parcelSpecs:
          type: object
          description: Elements specific to parcel shipping scenarios.
          properties:
            isDocumentsOnly:
              type: boolean
              description: Used on DHL parcel shipments to indicate if the parcel order only contains documents.
            bookingNumber:
              $ref: '#/components/schemas/bookingNumber'
        loadValues:
          type: object
          description: Values for the freight and/or trailer that will be used for an executed order.
          properties:
            equipmentLength:
              type: integer
              description: The desired length of trailer in feet.
            equipmentWidth:
              type: integer
              description: The desired width of trailer in inches.
            equipmentHeight:
              type: integer
              description: The desired height of trailer in inches.
            trailerNum:
              type: string
              description: The trailer number to be used for the freight.
            movementType:
              $ref: '#/components/schemas/movementTypeEnum'
        onlineParties:
          type: array
          description: Contains data which allows a third party visibility to an order belonging to their associated shipper via the Navisphere Online 2.0 product.
          items:
            type: object
            properties:
              partyType:
                type: string
                description: Represents the type of order party requesting visibility for the third party.
                enum:
                - CUSTOMER
                - BILLTO
              partyCode:
                type: string
                description: Represents the CHR customer code linked to the online/third party.
              relationshipIdentifier:
                type: string
                description: An identifier mutually recognized by all concerned parties interested in the progress of the shipment.
        shippingContainerValues:
          type: object
          description: Contains data about containers.
          properties:
            shippingContainers:
              $ref: '#/components/schemas/shippingContainers'
            shippingContainerItems:
              $ref: '#/components/schemas/shippingContainerItems'
        notes:
          type: string
          minimum: 1
          maximum: 4000
          description: Order level notes.
    labelReferenceData2:
      type: string
      description: Second piece of reference data to be used on the package label. This is used as the PO Number for FedEx or Reference Number 2 for UPS (not used for DHL or TNT).
      minLength: 1
      maxLength: 35
    BookingMode:
      enum:
