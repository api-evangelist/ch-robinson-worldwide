components:
  schemas:
    orderPackage:
      required:
      - packagingType
      type: object
      properties:
        packageType:
          $ref: '#/components/schemas/packageCodeEnum'
        parcelPackageType:
          $ref: '#/components/schemas/parcelPackageCodeEnum'
        weight:
          type: number
          description: Total weight of the package.
          format: float
        length:
          type: number
          description: The length of the package.
          format: float
        width:
          type: number
          description: The width of the package.
          format: float
        height:
          type: number
          description: The height of the package.
          format: float
        packageUnitOfMeasure:
          $ref: '#/components/schemas/linearUomEnum'
        volume:
          type: number
          format: float
          description: Volume of the package.
        packageVolumeUnitOfMeasure:
          $ref: '#/components/schemas/volumeUomEnum'
        weightLb:
          type: number
          description: Total weight of the package in standard pounds.
          format: float
        declaredValue:
          type: number
          format: float
          description: Insurance valuation of package.
        codAmount:
          type: number
          format: float
          description: Cash on deliver amount for the package.
        trackingNumber:
          type: string
          minimum: 1
          maximum: 100
          description: Tracking number assigned to package.
        notes:
          type: string
          minimum: 1
          maximum: 100
          description: A place for customer to put package level notes.
    gfBooking:
      required:
      - customerCode
      - customerReferenceNumber
      - sellMode
      type: object
      properties:
        customerReferenceNumber:
          minLength: 1
          type: string
          description: Indicates the customer's primary reference number.
        sellMode:
          $ref: '#/components/schemas/BookingMode'
        customerCode:
          maxLength: 50
          minLength: 1
          type: string
          description: Indicates the customer's code.
        incoTerms:
          $ref: '#/components/schemas/BookingIncoTerms'
        incoTermsNamedLocation:
          minLength: 1
          type:
          - string
          - 'null'
          description: Indicates the Incoterms named location (e.g. Shanghai).
        serviceLevel:
          $ref: '#/components/schemas/BookingServiceLevel'
        freightTerms:
          $ref: '#/components/schemas/BookingFreightTerm'
        shipperReadyByDateTime:
          type:
          - string
          - 'null'
          description: Indicates the date the shipper will have goods ready to ship in ISO8601 format.
          format: date-time
        notes:
          maxLength: 2000
          minLength: 1
          type:
          - string
          - 'null'
          description: Indicates the booking level notes (maximum 2000 characters).
        parties:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BookingParty'
          description: Indicates the parties on the order.
        locations:
          maxItems: 4
          minItems: 2
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BookingLocation'
          description: Indicates the locations on the order (minimum 2, maximum 4).
        containers:
          minItems: 1
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BookingContainer'
          description: Indicates the list of containers (minimum 1).
        commodityItems:
          type:
          - array
