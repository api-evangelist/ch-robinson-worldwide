    orderItem:
      required:
      - packagingType
      - quantity
      type: object
      properties:
        packagingType:
          $ref: '#/components/schemas/packageCodeEnum'
        itemId:
          type: integer
          description: Indicates the itemId. Distinct value by item that should only be used when sending shippingContainers, to link containers to their respective items.
        quantity:
          type: number
          format: float
          description: Quantity is the number of packagingType's.
        description:
          type: string
          minimum: 1
          maximum: 200
          description: Customer defined description of the item.
        productCode:
          type: string
          minimum: 1
          maximum: 20
          description: Customer defined code of the item.
        freightClass:
          $ref: '#/components/schemas/freightClassEnum'
        weight:
          type: number
          description: Total Weight of the line item. This represents to total weight of the all quantities. For example, if the indvidual weight of 1 quantity is 100 pounds, and the quantity of the line item is 2, then 200 is the value for this field.
          format: float
        weightUnitOfMeasure:
          $ref: '#/components/schemas/weightUomEnum'
        packagingLength:
          type: number
          description: The length of the line item packaging.
          format: float
        packagingWidth:
          type: number
          description: The width of the line item packaging.
          format: float
        packagingHeight:
          type: number
          description: The height of the line item packaging.
          format: float
        packagingUnitOfMeasure:
          $ref: '#/components/schemas/linearUomEnum'
        relationships:
          $ref: '#/components/schemas/relationships'
        equipmentLength:
          type: number
          format: float
          description: Indicates the length of the equipment needed to transport the item.
        equipmentHeight:
          type: number
          format: float
          description: Indicates the height of the equipment needed to transport the item.
        equipmentWidth:
          type: number
          format: float
          description: Indicates the width of the equipment needed to transport the item.
        equipmentUnitOfMeasure:
          $ref: '#/components/schemas/linearUomEnum'
        totalTrailerFeetUsed:
          type: integer
          description: Total feet item(s) will utilize inside the trailer.
        itemEquipment:
          $ref: '#/components/schemas/itemEquipment'
        packagingVolume:
          type: number
          format: float
          description: Volume of the item.
        packagingVolumeUnitOfMeasure:
          $ref: '#/components/schemas/volumeUomEnum'
        insuranceValue:
          type: number
          format: float
          description: Customer specified declared value of the item.
        pallets:
          type: number
          format: float
          description: Identifies how many pallets for the item.
        palletSpaces:
          type: number
          format: float
          description: Indentifies how many pallet spaces the item will use in the cargo space.
        nationalMotorFreightClass:
          type: string
          minimum: 1
          maximum: 50
          description: The National Motor Freight Traffic Association publishes the National Motor Freight Classification® (NMFC®), a standard that provides a comparison of commodities moving in commerce. The NMFC® is developed and maintained by the Commodity Classification Standards Board (CCSB).
        hazardousProperties:
          $ref: '#/components/schemas/hazardousProperties'
        upcNumber:
          type: string
          minimum: 1
          maximum: 50
          description: Universal Product Code. The barcode consists of a five digit manufacturer number and a five digit product number.
        skuNumber:
          type: string
          minimum: 1
          maximum: 50
          description: Stock Keeping Unit. A number assigned to a product by a the customer.
        pluNumber:
          type: string
          minimum: 1
          maximum: 50
          description: Price Look-up Number. A system of numbers the customer uses that uniquely identifies bulk produce
        isStackable:
          type: boolean
          description: Parameter to indicate if item(s) can be stacked one on top of the other.
        isTemperatureSensitive:
          type: boolean
          description: Parameter to indicate if item(s) needs to be kept between specific temperatures.
        temperatureType:
          $ref: '#/components/schemas/temperatureSensitiveEnum'
        temperatureUnit:
          $ref: '#/components/schemas/temperatureUomEnum'
        requiredTemperatureHigh:
          type: number
          description: The highest temperature the item(s) can be.
          format: float
        requiredTemperatureLow:
          type: number
          description: The lowest temperature the item(s) can be.
          format: float
        notes:
          type: string
          minimum: 1
          maximum: 4000
          description: Allows customer to add notes about the item.
        referenceNumbers:
          type: array
          description: Additional reference number objects pertaining to this item.
          items:
            $ref: '#/components/schemas/referenceNumber'
    bookingNumber:
      type: string
      description: The booking number for FedEx heavy air shipments.
