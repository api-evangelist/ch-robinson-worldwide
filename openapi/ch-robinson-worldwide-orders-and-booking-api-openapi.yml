    hazardousProperties:
      type: object
      description: Object containing hazardous material information.
      required:
      - description
      properties:
        description:
          type: string
          minimum: 1
          maximum: 500
          description: Description of the hazardous material.
        technicalName:
          type: string
          minimum: 1
          maximum: 50
          description: Technical name of the hazardous material.
        unNumber:
          type: string
          minimum: 1
          maximum: 10
          description: Four-digit numbers that identify dangerous goods, hazardous substances and articles (such as explosives, flammable liquids, toxic substances, etc.) in the framework of international transport.
          example: '2796'
        classCode:
          type: string
          minimum: 1
          maximum: 10
          description: Code for hazardous material in the framework of international transport.
        packagingGroup:
          $ref: '#/components/schemas/hazardousGroupEnum'
        emergencyPhone:
          type: string
          minimum: 1
          maximum: 50
          description: Emergency phone number.
        authCode:
          $ref: '#/components/schemas/hazmatCodeEnum'
        isPlacarded:
          type: boolean
          description: Does hazardous material have a placard.
        isReportableQuantity:
          type: boolean
          description: Hazardous material is defined as a reportable quantity.
        isPrimaryCommodity:
          type: boolean
          description: Is hazardous material considered a primary commodity.
        isNOSCommodity:
          type: boolean
          description: Is hazardous material considered a NOS commodity.
        flashpoint:
          type: number
          format: float
          description: Hazmat flash point is the minimum temperature at which a liquid gives off vapor within a test vessel in sufficient concentration to form an ignitable mixture with air near the surface of the liquid.
        flashpointTemperatureUnit:
          $ref: '#/components/schemas/temperatureUomEnum'
        isEnvironmentallyHazardous:
          type: boolean
          description: Is hazardous material considered environmentally hazardous.
        subsidiaryHazmatClasses:
          type: string
          minimum: 1
          maximum: 50
          description: Subsidiary Code for hazardous material in the framework of international transport.
        vesselStowageCategory:
          $ref: '#/components/schemas/vesselStowageCategoryEnum'
        specialProvisions:
          type: string
          minimum: 1
          maximum: 50
          description: Indicates the Special Provisions for Hazardous Materials.
        marinePollutantCategory:
          type: string
          description: Indicates the Marine Pollutant Category for Hazardous Materials.
          $ref: '#/components/schemas/marinePollutantCategory'
          enum:
          - SevereMarinePollutant
          - MarinePollutant
        emergencyResponseGuidePage:
          type: string
          minimum: 1
          maximum: 50
          description: Indicates the Emergency Response Guidebook Page for first responders during the initial Phase of Hazardous Materials Transportation Incident.
        passengerLimitation:
          type: string
          minimum: 1
          maximum: 50
          description: Indicates the passenger limitation for Hazardous Materials.
        cargoAircraftLimitation:
          type: string
          minimum: 1
          maximum: 50
          description: Indicates the Cargo Aircraft Limitation for Hazardous Materials.
        exemptionNotes:
          type: string
          minimum: 1
          maximum: 4000
          description: Indicates the exemption notes for Hazardous Materials.
