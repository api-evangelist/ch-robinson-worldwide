alse\",\n            \"dropOffAtCarrierTerminal\": \"false\",\n            \"pickupAtCarrierTerminal\": \"false\"\n        },\n        \"isPort\": \"false\",\n        \"unLocode\": \"US AC8\",\n        \"iata\": \"ACB\",\n        \"customerLocationId\": \"W541849\",\n        \"referenceNumbers\": [\n            {\n                \"type\": \"DEL\",\n                \"value\": \"DeliverNumber1\"\n            }\n        ]\n    },\n    \"shipDate\": \"2019-03-20T20:30:00.0000000Z\",\n    \"customerCode\": \"C8283603\",\n    \"declaredValue\": 50000,\n    \"transportModes\": [\n        {\n            \"mode\": \"LTL\",\n            \"equipments\": [\n                {\n                    \"equipmentType\": \"Van\",\n                    \"quantity\": 1\n                }\n            ]\n        }\n    ],\n    \"referenceNumbers\": [\n        {\n            \"type\": \"MBOL\",\n            \"value\": \"MBOL12345\"\n        }\n    ],\n    \"optionalAccessorials\": [\n        \"EXL\"\n    ]\n}\", ParameterType.RequestBody);\n IRestResponse response = client.Execute(request);"
