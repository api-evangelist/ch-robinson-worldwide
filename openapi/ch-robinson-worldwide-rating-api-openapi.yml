components:
  schemas:
    specialServicesEnum:
      type: string
      description: "Defines the specialServices:\n  * `teamDriver` - indicates if truckload includes 2 drivers\n  * `STF` - driver and equipment meet safe transportation of food standards\n  * `tankerEndorsement` - driver is certified to move containers with liquids\n"
      enum:
      - teamDriver
      - STF
      - tankerEndorsement
    cargoLiability:
      type: object
      description: Informs of carrier liability coverages.
      properties:
        perPound:
          type: integer
          description: Carrier’s liability per pound based on product attributes.
        max:
          type: integer
          description: Carrier’s maximum liability based on product attributes.
        amount:
          type: integer
          description: Calculated liability coverage for specific quote based on product attributes.
        currencyCode:
          $ref: '#/components/schemas/currencyCodeEnum'
    specialRequirementRating:
      type: object
      properties:
        liftGate:
          type: boolean
          description: Indicates that a lift gate is needed.
        insidePickup:
          type: boolean
          description: Indicates that inside pickup is needed. **Only used on the origin/pick stop**
        insideDelivery:
          type: boolean
          description: Indicates that inside delivery is needed. **Only used on the destination/drop stop**
        residentialNonCommercial:
          type: boolean
          description: Indicates that a stop is residential non-commercial.
        limitedAccess:
          type: boolean
          description: Indicates that stop has limited access.
        tradeShoworConvention:
          type: boolean
          description: Indicates that stop is a trade show or convention.
        constructionSite:
          type: boolean
          description: Indicates that stop is a construction site.
        dropOffAtCarrierTerminal:
          type: boolean
          description: Indicates that customer will drop off at carrier terminal. **Only used on the origin/pick stop**
        pickupAtCarrierTerminal:
          type: boolean
          description: Indicates that customer will pickup at carrier terminal. **Only used on the destination/drop stop**
        hasDropTrailer:
          type: boolean
          description: Indicates if this location is drop trailer.
        appointmentNotification:
          type: boolean
          description: Indicates that stop has an appointment notification. Only used on the destination/drop stop.
    transportMode:
      type: object
      description: Define information for transport criteria
      required:
      - mode
      properties:
        mode:
          $ref: '#/components/schemas/transportModeEnum'
        equipments:
          type: array
          description: List of required equipment needed.
          items:
            $ref: '#/components/schemas/equipment'
    temperatureSensitiveEnum:
      type: string
      description: "Indicates if temperature control is needed, and what level:\n  * `Dry` - Dry\n  * `Fresh` - Fresh (25 to 32 degrees)\n  * `Frozen` - Frozen (-10 to 0 degrees)\n  * `Chilled` - Chilled (40 to 60 degrees)\n  * `DeepFrozen` - Deep Frozen (-20 to -20 degrees)\n  * `Refrigerated` - Refrigerated (33 to 39 degrees)\n  * `Protect` - Protect (33 to 60 degrees)\n  * `Custom` - Custom\n  * `Produce` - Produce\n  * `Mixed` - Mixed\n  * `Empty` - Empty\n"
      enum:
