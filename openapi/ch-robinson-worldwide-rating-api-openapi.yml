    ratingPost:
      required:
      - items
      - origin
      - destination
      - shipDate
      - customerCode
      - transportModes
      properties:
        items:
          type: array
          description: Identifies all relevant item level information
          items:
            $ref: '#/components/schemas/ratingItem'
        origin:
          $ref: '#/components/schemas/ratingLocation'
        destination:
          $ref: '#/components/schemas/ratingLocation'
        additionalLocations:
          type: array
          description: Only required for multi stop requests
          items:
            $ref: '#/components/schemas/ratingLocation'
        shipDate:
          type: string
          format: date-time
          description: "An ISO8601 UTC date-time used to indicate the date customer would like to ship the product. \n\n ### <span style=\"color:Red\">**This date can not be earlier than the current date and can not be more than thirty days in the future.</span>"
        platform:
          type: string
          description: "A static ID that represents an external party to C.H. Robinson. It can be used by C.H. Robinson to route external rate requests based on specific customer needs. To use this field, C.H. Robinson must generate and provide this ID to the external party. \n\n ### <span style=\"color:Red\">**This field is required for TMC customers.  Reach out to your TMC Representative to obtain this ID.</span> \n\n ### <span style=\"color:Red\">**Note that the API team does not provide this ID, and the majority of customers will not be using this field.</span>"
        transactionId:
          type: string
          description: "This ID is a permanent link between the unique shipment being quoted and the quote offered by C.H. Robinson - it is normally the primary shipment reference number, a value that should not change during the lifecycle of the shipment. The same transactionId should be submitted in the rate request when re-rating the same shipment. \n\n ### <span style=\"color:Red\">**Required for Truckload Quoting</span>"
        customerCode:
          type: string
          minimum: 1
          maximum: 50
          description: C.H. Robinson defined code that is provided to the customer.
        transportModes:
          type: array
          description: Array of transport modes
          items:
            $ref: '#/components/schemas/transportMode'
        referenceNumbers:
          type: array
          description: Array of additional reference numbers that can be provided.
          items:
            $ref: '#/components/schemas/referenceNumber'
        optionalAccessorials:
          type: array
          description: "C.H. Robinson defined code for additional accessorials not defined in the special requirements object. \n\n ### <span style=\"color:Red\">**To take advantage of additional accessorials, a conversation will need to take place with your C.H. Robinson representative.</span>"
          items:
            type: string
        specialServices:
          type: array
          description: Array of special services.
          items:
            $ref: '#/components/schemas/specialServicesEnum'
    transportModeEnum:
      type: string
      description: "Defines the mode:\n  * `LTL` - Less Than Truckload\n  * `TL` - Truckload\n  * `Air` - Air\n  * `Ocean` - Ocean\n  * `Bulk` - Bulk\n  * `Consol` - Consolidated\n  * `Flatbed` - Flatbed\n  * `IMDL` - Intermodal\n"
      enum:
