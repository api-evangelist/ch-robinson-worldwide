    quoteSummaries:
      properties:
        quoteSummaries:
          type: array
          description: Array of quotes.
          items:
            type: object
            properties:
              quoteId:
                type: integer
                format: int64
                description: ID of the quote that is provided on successfully calling the rating API.
              carrier:
                type: object
                description: Identifies the carrier associated to the quote.
                properties:
                  carrierCode:
                    type: string
                    description: The unique identifier assigned to a carrier within C.H. Robinson.
                  carrierName:
                    type: string
                    minimum: 1
                    maximum: 50
                    description: The name of the carrier.
                  scac:
                    type: string
                    minimum: 1
                    maximum: 10
                    description: The SCAC code of a carrier if it has one.
              customer:
                type: object
                description: C.H. Robinson customer associated to the quote.
                properties:
                  customerName:
                    type: string
                    minimum: 1
                    maximum: 50
                    description: Customer name associated to the quote.
              totalCharge:
                type: number
                format: float
                description: Total charge associated to the quote.
              totalFreightCharge:
                type: number
                format: float
                description: Total freight charge associated to the quote.
              totalAccessorialCharge:
                type: number
                format: float
                description: Total accessorial charge associated to the quote.
              quoteExpirationDate:
                type: string
                format: date-time
                description: An ISO8601 UTC date-time used to indicate the date the quote will no longer be valid.
              transit:
                type: object
                description: Collection of transit information associated to the quote.
                properties:
                  minimumTransitDays:
                    type: number
                    format: float
                    description: Minimum transit days.
                  maximumTransitDays:
                    type: number
                    format: float
                    description: Maximum transit days.
                  minimumDeliveryDate:
                    type: string
                    format: date-time
                    description: An ISO8601 UTC date-time used to indicate the minimum delivery date.
                  maximumDeliveryDate:
                    type: string
                    format: date-time
                    description: An ISO8601 UTC date-time used to indicate the maximum delivery date.
                  originService:
                    type: string
                    description: Denotes whether an LTL carrier services the location terminal on their own (direct) or through the help of partner carriers who can service the location terminal on their behalf (indirect).
                    enum:
                    - Direct
                    - Indirect
                    - No Data
                  destinationService:
                    type: string
                    description: Denotes whether an LTL carrier services the location terminal on their own (direct) or through the help of partner carriers who can service the location terminal on their behalf (indirect).
                    enum:
                    - Direct
                    - Indirect
                    - No Data
              rates:
                $ref: '#/components/schemas/rates'
              transportModeType:
                $ref: '#/components/schemas/transportModeEnum'
              equipmentType:
                $ref: '#/components/schemas/equipmentCodeEnum'
              cargoLiability:
                $ref: '#/components/schemas/cargoLiability'
              distance:
                type: number
                description: Indicates rated distance.
              quoteSource:
                type: string
                description: A field to indicate whether the quote returned is contracted, market or volume.
