                  address2: 123 Street
                  city: Blaine
                  stateProvinceCode: MN
                  postalCode: '55428'
                  countryCode: US
                  requested: '2018-12-11T01:14:00-08:00'
                  openDateTime: '2019-02-20T12:00:00.000Z'
                  closeDateTime: '2019-02-22T22:30:00.000Z'
                  iata: ALO
                  referenceNumbers:
                  - type: AAR
                    value: 1A23ZZ32599ABC
              handlingUnits:
              - handlingUnitId: CO_1480525_1
                packagingType: pallet
                quantity: 1
                freightClass: '70'
                weight: 1996
                weightUnitOfMeasure: pounds
                packagingLength: '10'
                packagingUnitOfMeasure: feet
                volume: '5'
                volumeUnitOfMeasure: CubicFeet
                containerNumber: '343534534'
                description: notes
                orderNumbers:
                - test101
                commodities:
                - commodityId: CO_1480525_1_1
                  orderNumber: '32432'
                  name: widgets
                  units: 1
                  sku: e87r99
                  plannerCode: '1234'
                  value: 50
                  currencyCode: USD
                  serialNumber: sad23432
                  partNumber: ds536
                  isHazMat: true
                  pickLocSequenceNumber: 0
                  dropLocSequenceNumber: 1
                  category: tractor
                  description: TRACTOR DESCRIPTION
