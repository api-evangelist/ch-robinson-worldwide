                  weight: 0
                  weightUnitOfMeasure: pounds
                  packagingLength: 0
                  packagingWidth: 0
                  packagingHeight: 0
                  packagingUnitOfMeasure: feet
                  packageQuantity: '10'
                  purchaseOrderNumber: 123abc
                  referenceNumbers:
                  - type: AAR
                    value: 1A23ZZ32599ABC
