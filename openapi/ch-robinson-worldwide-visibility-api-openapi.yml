components:
  schemas:
    cargoLiability:
      type: object
      description: Informs of carrier liability coverages.
      properties:
        perPound:
          type: integer
          description: Carrier’s liability per pound based on product attributes.
        max:
          type: integer
          description: Carrier’s maximum liability based on product attributes.
        amount:
          type: integer
          description: Calculated liability coverage for specific quote based on product attributes.
        currencyCode:
          $ref: '#/components/schemas/currencyCodeEnum'
    distanceUomEnum:
      type: string
      description: Unit of measure for distance parameters.
      enum:
      - Miles
      - Kilometers
    visibilityLocation:
      type: object
      description: All locations associated with the order.
      required:
      - locationId
      - sequenceNumber
      - stopRole
      - name
      - address1
      - countryCode
      properties:
        locationId:
          type: string
          minimum: 1
          maximum: 20
          description: Unique Identifier
        sequenceNumber:
          type: number
          description: Beginning at 0, increasing sequentially with each location in stop order
        stopRole:
          type: string
          description: Stop role of the location
          enum:
          - pick
          - drop
          - crossDock
          - destinationAirport
          - destinationPort
          - destinationTerminal
          - intermediaryAirport
          - intermediaryPort
          - intermediaryRamp
          - originAirport
          - originPort
          - originRamp
          - originTerminal
          - originForwarder
          - originCrossdock
          - destinationForwarder
          - destinationCrossdock
          - destinationRamp
          - dropyard
          - supplier
          - shipper
          - consignee
          - origin
          - destination
          - broker
          - agent
          - factory
        name:
          type: string
          minimum: 1
          maximum: 200
          description: Name of the location
        address1:
          type: string
          minimum: 1
          maximum: 100
          description: Indicate address line 1
        address2:
          type: string
          minimum: 1
          maximum: 100
          description: Indicate address line 2
        city:
          type: string
          minimum: 1
          maximum: 100
          description: Indicate City
        stateProvinceCode:
          type: string
          minimum: 1
          maximum: 50
          description: Indicate State or Province
        postalCode:
          type: string
          minimum: 1
          maximum: 20
          description: Indicate Postal codes
        countryCode:
          type: string
          minimum: 1
          maximum: 2
          description: Indicate 2 digit country code utilizing ISO 3166-1 alpha-2
        requested:
          type: string
          format: date-time
          description: Order need by date, enter close date time if window time is provided in an ISO8601 format.
        openDateTime:
          type: string
          format: date-time
          description: Beginning of order need by window, enter requested date if no window time is provided in an ISO8601 format.
        closeDateTime:
          type: string
          format: date-time
          description: End of order need by window, enter requested date if no window time is provided in an ISO8601 format.
        unlocationCode:
          type: string
          description: The UN Location Code for the stop location.
          minimum: 1
          maximum: 10
        iata:
          type: string
          description: International Air Transport Association (IATA)
          minimum: 1
          maximum: 10
        referenceNumbers:
          type: array
