openapi: 3.2.0
info:
  version: 2.0.0
  title: A guide to C.H. Robinson's REST Visibility API
  description: '# Introduction

    Welcome to C.H.'
servers:
- url: https://sandbox-api.navisphere.com
  description: Test environment.
- url: https://api.navisphere.com
  description: Production environment.
security:
- sandbox: []
tags:
- name: Visibility
  description: Navisphere® Vision and Visibility tool is a global visibility technology that allows select customers to view and proactively manage their supply chain movements from a single platform. The tool combines real-time order and shipment information with transportation updates and external factors that can influence a supply chain, including weather, traffic, and current events to help customers prevent potential disruptions.
paths:
  /v2/visibility/shipments:
    post:
      description: Post a shipment create into Navisphere® Vision and/or Navisphere® Analytics.
      x-beta: true
      operationId: Visibility Shipment Create
      tags:
      - Visibility
      requestBody:
        description: JSON object of shipment information.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/shipments'
            example:
              shipmentNumber: '12345'
              tenantId: tenantid
              trackingNumber: 1ZT33888AY
              accountCode: ACT12345
              scac: ACL
              customerName: Your Customer Name
              carrierName: Gray Transportation, Inc.
              carrierProNumber: '0043275'
              trailerNumber: '3631'
              equipmentType: Van
              mode: LTL
              containerInformation:
              - containerNumber: '123456789'
                containerType: 45HR
                containerWeight: '1000'
                weightUnitOfMeasure: Kilograms
              shipmentDistance: '900'
              shipmentDistanceUnitOfMeasure: miles
              isPremiumFreight: false
              isManaged: true
              movementType: car
              incoTerms: DAT
              teuCount: '3432'
              orderNumbers:
              - test101
              stops:
