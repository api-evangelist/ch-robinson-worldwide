          description: Items associated to this shipment.
          items:
            $ref: '#/components/schemas/bookedItem'
        packages:
          type: array
          description: List of packages associated to the shipment.
          items:
            $ref: '#/components/schemas/eventLoadPackage'
    orderEvent:
      type: object
      properties:
        eventType:
          type: string
          description: "Indicates the type of order event.\n* ORDER CREATED - Order has been created in the C.H. Robinson system. <span style=\"color:DeepPink\">This event should be listened to as confirmation the order has successfully been created in Navisphere® Order Management System.</span>\n* ORDER UPDATE - An update has occured on the order. \n* ORDER CANCELED - The order has been canceled. \n* ORDER REJECTED - The order was rejected and will not continue processing. \n* ORDER COMPLETED - All loads associated to the order have been delivered and order is complete."
          enum:
          - ORDER CREATED
          - ORDER REJECTED
          - ORDER UPDATED
          - ORDER CANCELED
          - ORDER COMPLETED
        eventSubType:
          type: string
          description: Indicates the sub type of order updated event. This is only applicable for Order Updated events, and must be subscribed to individually. Events consumers are automatically opted into 'ORDER UPDATE', which indicates when the service is planned or the service is booked.
          enum:
          - ORDER UPDATE
          - ADD ITEM DETAILS
          - REMOVE ITEM DETAILS
          - UPDATE ITEM DETAILS
          - ADD PARTY
          - UPDATE PARTY
          - REMOVE PARTY
          - UPDATE PLAN
          - CREATE PLAN
          - REMOVE PLAN
          - UPDATE ORDER STATUS
          - UPDATE ORIGIN DATE
          - UPDATE DELIVERY DATE
          - UPDATE REFERENCE NUMBER
        orderDetail:
          type: array
          description: Contains order number and order tracking information.
          items:
            $ref: '#/components/schemas/orderEventOrderDetail'
        loadNumbers:
          type: array
          description: C.H. Robinson defined shipment number(s) tied to this order.
          items:
            type: integer
        referenceNumbers:
          type: array
          description: Any additional reference numbers that are contained on the order.
          items:
            $ref: '#/components/schemas/referenceNumber'
    globalForwardingQuantity:
      type: object
      properties:
        value:
          type: number
          format: decimal
        unitOfMeasure:
          description: The unit of measure for the quantity.
