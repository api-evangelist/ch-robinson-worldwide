    eventLocation:
      type: object
      description: Location information specific to the event.
      properties:
        chrLocationId:
          type: string
          description: C.H. Robinson defined location identifier.
        customerLocationId:
          type: string
          description: Customer generated location identifier.
        type:
          type: string
          description: Identifies the type of stop the location is.
        style:
          type: string
          description: identifies the style of the stop.
        stopSequenceNumber:
          type: integer
          description: Number to indicate where in the order of stops the location is. C.H. Robinson uses a zero index. This means the \"0\" will indicate the first stop in the sequence of stops.
        sequenceNumber:
          type: integer
          description: System generated number applied to the location when it is entered into the system.
        name:
          type: string
          description: Name of the location.
        address:
          $ref: '#/components/schemas/eventAddress'
        pickUpNumber:
          type: string
          description: Pick-Up number.
        deliveryNumber:
          type: string
          description: Delivery number.
        locationContact:
          type: object
          description: Contact information for the location.
          properties:
            name:
              type: string
              description: Name of contact at the location.
            phoneNumber:
              type: string
              description: Phone number of contact at the location.
            email:
              type: string
              description: E-mail address of the contact at the location.
        referenceNumbers:
          type: array
          description: Reference numbers associated to this location.
          items:
            $ref: '#/components/schemas/referenceNumber'
    loadEvent:
      type: object
      properties:
        eventType:
          type: string
          description: "Load level events. \n* `LOAD CREATED` - A shipment has been created in our execution system. \n* `LOAD BOOKED` - Carrier has been selected to transport the shipment.\n* `LOAD CANCELLED` - The load has been cancelled. \n* `PRO NUMBER ADDED` - Pro Number has been added to the shipment."
          enum:
          - LOAD CREATED
          - LOAD BOOKED
          - LOAD CANCELLED
          - PRO NUMBER ADDED
        orderDetails:
          type: array
          description: Contains order number and order tracking information.
          items:
            $ref: '#/components/schemas/loadEventOrderDetail'
        loadNumber:
          type: integer
          description: C.H. Robinson defined shipment number.
        equipmentType:
          type: string
          description: Indicates the equipment type.
        mode:
          type: string
          description: Indicates the mode of the shipment.
          enum:
          - Truckload
          - LTL Linehaul
          - Small Parcel
          - Bulk Transportation
          - Intermodal Linehaul
          - Intermodal Pickup Drayage
          - Intermodal Delivery Drayage
          - Intermodal Cross Town Dray
        serviceOffering:
          type: string
          description: Indicates the level of service associated to the shipment.
          enum:
          - LTL Transportation
          - Truckload Transportation
          - Consolidated Transportation
          - Truckload Temp Controlled Transportation
          - Truckload Flatbed Transportation
          - Small Parcel
          - LTL Temp Controlled Transportation
          - Consolidated Temp Controlled Transportation
          - LTL Europe
          - Produce Truckload Temp Controlled Transportation
          - Intermodal Full Container Transportation
          - International Ocean NVOCC
          - Produce LTL Temp Controlled Transportation
          - Domestic Air Transportation
          - Bulk Transportation
          - Ocean
          - Truckload Tautliner Europe
          - Broker - Inventory Freight
          - International Air House
          - Produce Consolidation Temp Controlled Transportation
          - Intermodal Full Temp Controlled Transportation
          - LTL Flatbed Transportation
          - Truckload Europe Box
          - Truckload Bulk Europe
          - International Air Direct
          - Intermodal Europe
          - Tautliner
          - Broker Produce Freight Partial Dry Van
        readyByDate:
          type: string
          format: date-time
          description: Earliest date, local to location, carrier can pick up the shipment.
        pickupByDate:
          type: string
          format: date-time
          description: Latest date, local to location, carrier can pick up the shipment.
        deliveryAvailableByDate:
          type: string
          format: date-time
          description: Earliest date, local to location, carrier can deliver the shipment.
        deliveryByDate:
          type: string
          format: date-time
          description: Latest date, local to location, carrier can deliver the shipment.
