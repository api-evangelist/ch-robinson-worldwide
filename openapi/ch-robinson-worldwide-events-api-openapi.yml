    globalForwardingShipmentEvent:
      type: object
      description: Represents a Global Forwarding shipment event.
      properties:
        eventType:
          description: The type of event that occurred on the shipment.
          oneOf:
          - $ref: '#/components/schemas/globalForwardingEventTypeEnum'
          - $ref: '#/components/schemas/globalForwardingUnknownEventTypeValue'
        shipmentNumber:
          description: A unique identifier for this shipment. This value is generated by CHR.
          type: string
        agentReferenceNumber:
          description: A unique identifier for this shipment. This value is supplied to CHR by the agent.
          type:
          - string
          - 'null'
        customerReferenceNumber:
          description: A unique identifier for this shipment. This value is supplied to CHR by the customer.
          type:
          - string
          - 'null'
        shipmentType:
          description: The type of shipment.
          oneOf:
          - $ref: '#/components/schemas/globalForwardingShipmentTypeEnum'
          - $ref: '#/components/schemas/globalForwardingUnknownShipmentTypeValue'
        purchaseOrderNumbers:
          description: Purchase order numbers associated with the shipment.
          type: array
          uniqueItems: true
          items:
            type: string
        servicesProvidedByChr:
          description: 'The services provided by CHR for this shipment. For example, CHR may only provide Freight Forwarding services (in which case, this array would have only one elemnt). CHR may also provide Customs Brokerage services in addition (in which case, this array would have two elements -- one for each service).

            '
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/globalForwardingChrServiceEnum'
            - $ref: '#/components/schemas/globalForwardingUnknownChrServiceValue'
        serviceLevel:
          description: 'The extent of service provided by CHR for this shipment. For example, CHR may be responsible for the entire shipment from origin warehouse to the destination warehouse, or only from the origin port to the destination port.

            '
          oneOf:
          - $ref: '#/components/schemas/globalForwardingServiceLevelEnum'
          - $ref: '#/components/schemas/globalForwardingUnknownServiceLevelValue'
        mode:
          description: The mode of transportation for the shipment.
          oneOf:
          - $ref: '#/components/schemas/globalForwardingModeEnum'
          - $ref: '#/components/schemas/globalForwardingUnknownModeValue'
        status:
          description: The current status of the shipment.
          oneOf:
          - $ref: '#/components/schemas/globalForwardingShipmentStatusEnum'
          - $ref: '#/components/schemas/globalForwardingUnknownShipmentStatusValue'
        incoLocation:
          description: The location where the IncoTerms apply.
          type: string
        incoTerms:
          description: The International Commercial Terms (IncoTerms) that apply to the shipment.
          oneOf:
          - $ref: '#/components/schemas/globalForwardingIncoTermsEnum'
          - $ref: '#/components/schemas/globalForwardingUnknownIncoTermsValue'
        freightTerms:
          description: The freight terms that apply to the shipment.
          oneOf:
