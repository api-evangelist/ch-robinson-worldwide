    trackingNumberEvent:
      type: object
      properties:
        eventType:
          type: string
          description: "Indicates CHR Tracking Number has been associated to the order/shipment. \n* `CHR TRACKING NUMBER PUBLISHED` - CHR Tracking Number has been associated to the order/shipment."
          enum:
          - CHR TRACKING NUMBER PUBLISHED
        chrTrackingNumber:
          type: string
          description: CHR Number available for tracking on Customer Platform.
        trackingType:
          type: string
          description: Identifies the core system and phase of transaction producing the number.
          enum:
          - order
          - shipment
        customerCode:
          type: string
          description: CH Robinson defined customer code.
        referenceNumber:
          type: string
          description: CHR order number or shipment (load) number.
    contact:
      type: object
      description: Object containing contact information.
      required:
      - name
      - type
      - companyName
      - contactMethods
      properties:
        name:
          type: string
          minimum: 1
          maximum: 200
          description: Name of the contact.
        type:
          $ref: '#/components/schemas/contactTypeEnum'
        companyName:
          type: string
          minimum: 1
          maximum: 100
          description: Company name of the contact.
        contactMethods:
          type: array
          description: Contact Methods
          items:
            $ref: '#/components/schemas/contactMethod'
    proposedCarrier:
      type: object
      description: Carrier CHR is proposing to use for this shipment (Only available for Small Parcel Mode).
      properties:
        carrierCode:
          type: string
          description: C.H. Robinson defined carrier code.
    contactMethodEnum:
      type: string
      description: 'Indicates the best method for reaching the specified contact.

        '
      enum:
      - Email
      - Phone
      - Fax
    bookedCustomer:
      type: object
      description: The customer(s) on the shipment.
      properties:
        customerCode:
          type: string
          description: C.H. Robinson defined customer code.
        customerName:
          type: string
          description: The name of the customer.
        contacts:
          type: array
          description: Customer contacts.
          items:
            $ref: '#/components/schemas/contactPosition'
        ebolEnabledWithCarrier:
          type: boolean
          description: Indicates if customer is enabled with listed carrier to retrieve PRO number in advance of pickup.
        referenceNumbers:
          type: array
          description: Customer reference numbers.
          items:
            $ref: '#/components/schemas/referenceNumber'
    eventAddress:
      type: object
      description: Contains address information
      required:
      - city
      - stateProvinceCode
      properties:
        addressLine1:
          type: string
          description: Line one of the address.
        addressLine2:
          type: string
          description: Line two of the address.
        city:
          type: string
          description: City name of address.
        stateProvinceCode:
          $ref: '#/components/schemas/stateProvinceCodeEnum'
        postalCode:
          type: string
          description: Postal code of address.
        country:
          $ref: '#/components/schemas/countryCodeEnum'
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          description: The decimal latitude of the address.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          description: The decimal longitude of the address.
    eventItem:
      type: object
      properties:
        packagingType:
          $ref: '#/components/schemas/packageCodeEnum'
        description:
          type: string
          description: Customer defined description of the item in the order (product name).
        productCode:
          type: string
          description: Customer defined code of the item in the order.
        freightClass:
          $ref: '#/components/schemas/freightClassEnum'
        insuranceValue:
          type: number
          format: float
          description: Insurance valuation of item.
        innerPackQuantity:
          type: float
          description: Represents the number of units of the innermost packing.
        primaryReferenceNumber:
          type: string
          description: Primary reference number of the item.
        poNumber:
          type: string
          description: PO number number of the item.
        skuNumber:
          type: string
          description: sku number of the item.
        pluNumber:
          type: string
          description: plu number of the item.
        actualQuantity:
          type: string
          format: integer
          description: Confirmed quantity of the item(s).
        actualWeight:
          type: string
          format: float
          description: Confirmed weight of the item(s).
        actualWeightUnitOfMeasure:
          $ref: '#/components/schemas/weightUomEnum'
        actualPallets:
          type: string
          format: float
          description: Actual pallet count of the item(s).
        actualVolume:
