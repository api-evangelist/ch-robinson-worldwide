openapi: 3.2.0
info:
  version: 2.0.0
  title: A guide to C.H. Robinson's REST Events API
  description: '# Introduction

    Welcome to C.H.'
servers:
- url: https://sandbox-api.navisphere.com
  description: Test environment.
- url: https://api.navisphere.com
  description: Production environment.
security:
- sandbox: []
tags:
- name: Events
  description: 'C.H. Robinson''s Events product gives complete, near real-time order and shipment information, including all transportation updates.

    Integrating with C.H. Robinson''s Events API give partners near visibility into their supply chain directly to their own TMS or ERP system.

    There are two ways to integrate with C.H. Robinson events: via a callback/webhook (preferred and most real-time) or via a periodic event retrieval (easiest to implement and less real-time).'
paths:
  /REPLACE_ME_WITH_YOUR_CALLBACK_URL:
    servers:
    - url: https://yourserver.com
      description: partner defined endpoint
    post:
      security:
      - bearerAuth: []
      description: 'C.H. Robinson provides a callback solution for our customers. In a Callback integration type (also known as a Webhook or an HTTP Push API), users set up their own API and ask C.H. Robinson to call it whenever an order or shipment update occurs.


        The callback product provides the following features:

        - Pushes individual real-time event messages from the Navisphere system to the receiving system for all active transactions.

        - Allows the partner to choose from a list of event types to receive.

        - Minimizes outbound calls to CHR systems.


        **Requirements:**

        - All that is needed is a URL and an authorization methodology, and C.H. Robinson takes care of the rest.

        - The URL needs to be a RESTful API that supports `Content-Type: application/json`.


        **Supported Authorization Strategies:**

        - Basic Auth (username/password).

        - OAuth 1.0

        - OAuth 2.0

        - Api_key

        - No Auth'
      x-beta: false
      operationId: Events Callback
      tags:
      - Events
      requestBody:
        description: JSON object of Load Detail message.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventResponse'
      responses:
        2XX:
          description: Your server returns this code if it accepts the callback
          content:
            text/plain:
              schema:
                type: string
                example: OK
      summary: Events callback
      x-summary-source: derived
  /v2/events:
    get:
      security:
      - bearerAuth: []
      description: 'For customers that cannot integrate via callbacks, C.H. Robinson also provides an Event Retrieval solution.


        This retrieval product provides the following features:

        - Updates from Navisphere are made available in real-time.

        - Provides available data for all desired transactions, even those in the past, available as one call or one per transaction.

        - Retrieval intervals are controlled by the partner.

        - Allows the partner to choose from a list of event types to receive.


        Compared to the Callback solution, this product has the following weaknesses:

        - Shipment updates are only as real-time as the interval to call CH Robinson.

        - Some calls will use unnecessary resources when a call yields no new updates.


        **Note:** Values are case sensitive, for example, customerReferenceNumber will return different results for MN compared to mn.'
      operationId: Event Retrieval
      tags:
      - Events
      parameters:
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
        description: Starting date/time of event search.
        example: '2019-04-20T20:30:00.0000000Z'
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
        description: Ending date/time of event search.
        example: '2019-04-27T20:30:00.0000000Z'
      - in: query
        name: loadNumber
        required: false
        schema:
          type: string
        description: C.H. Robinson defined shipment number.
        example: 293045309
      - in: query
        name: orderNumber
        required: false
        schema:
          type: string
        description: C.H. Robinson defined order number.
        example: 79308056
      - in: query
        name: billToReferenceNumber
        required: false
        schema:
          type: string
        description: 'Customer bill to reference number. Typically this is the customer''s order number. The following special characters are allowed: - _ , . : ; | # * ^ & ! ~ ` /'
        example: 2120147
      - in: query
        name: customerReferenceNumber
        required: false
        schema:
          type: string
        description: 'Customer reference number. The following special characters are allowed: - _ , . : ; | # * ^ & ! ~ ` /'
        example: 14411
      - in: query
        name: navisphereTrackingNumber
        required: false
        schema:
          type: string
        description: C.H. Robinson online tracking reference number.
        example: YT6RHXA2PD6PY
      - in: query
        name: eventType
        required: false
        schema:
          type: string
        description: "Identify specific event(s) you want returned. To select multiple events use a comma-delimited string.\nIf empty, will default to all events.\n\n<details><summary><h5><strong>Possible Event Types: (click to expand)</strong></h5></summary>\n\n  <strong>Order Event:</strong><br>\n  ORDER CREATED, ORDER REJECTED, ORDER UPDATED, ORDER CANCELED, ORDER COMPLETED\n\n  <strong>Load Event:</strong><br>\n  LOAD CREATED, LOAD BOOKED, LOAD CANCELLED, PRO NUMBER ADDED\n\n  <strong>Stop Event:</strong><br>\n  CARRIER ARRIVED, CARRIER DEPARTED, LOAD PICKED UP, LOAD DELIVERED\n\n  <strong>Appointment Event:</strong><br>\n  APPOINTMENT UPDATED\n\n  <strong>In Transit Event:</strong><br>\n  IN TRANSIT, IN TRANSIT TO ORIGIN\n\n  <strong>Package In Transit Event:</strong><br>\n  PACKAGE IN TRANSIT, PACKAGE PICKED UP, PACKAGE DELIVERED\n\n  <strong>Global Forwarding Event:</strong>\n  <details><summary>Generic events (click to expand)</summary>\n    SHIPMENT CREATED, SHIPMENT BOOKED, SHIPMENT CANCELLED, CONTAINER CREATED, CONTAINER CANCELLED, CONTAINER UPDATED\n  </details>\n\n  <details><summary>Estimated Dates (click to expand)</summary>\n    SHIPMENT ESTIMATED DELIVERY DATE CHANGED, ESTIMATED DELIVERY DATE CHANGED, ESTIMATED TIME OF VESSEL DEPARTURE CHANGED, ESTIMATED TIME OF VESSEL ARRIVAL CHANGED, ESTIMATED TIME OF VESSEL ARRIVAL/DEPARTURE CHANGED, ESTIMATED TIME OF FLIGHT DEPARTURE CHANGED, ESTIMATED TIME OF FLIGHT ARRIVAL CHANGED, ESTIMATED TIME OF FLIGHT ARRIVAL/DEPARTURE CHANGED, ESTIMATED ARRIVAL TO DESTINATION RAIL CHANGED\n  </details>\n\n  <details><summary>Actual Dates (click to expand)</summary>\n    <div><strong>Pick up warehouse:</strong> ARRIVED AT PICKUP, CARGO PICKED UP</div>\n    <div><strong>Origin ramp:</strong> ARRIVED AT ORIGIN RAMP, DEPARTED FROM ORIGIN RAMP</div>\n    <div><strong>Origin terminal:</strong> ARRIVED AT ORIGIN TERMINAL, DEPARTED FROM ORIGIN TERMINAL</div>\n    <strong>Origin port/airport:</strong>\n    <div>Ocean: IN GATE AT ORIGIN PORT, VESSEL DEPARTED FROM ORIGIN PORT</div>\n    <div>Air: IN GATE AT ORIGIN AIRPORT, FLIGHT DEPARTED FROM ORIGIN AIRPORT</div>\n    <strong>Intermediary port/airport:</strong>\n    <div>Ocean: VESSEL ARRIVED AT INTERMEDIARY PORT, VESSEL DEPARTED FROM INTERMEDIARY PORT</div>\n    <div>Air: FLIGHT ARRIVED AT INTERMEDIARY AIRPORT, FLIGHT DEPARTED FROM INTERMEDIARY AIRPORT</div>\n    <strong>Destination port/airport:</strong>\n    <div>Ocean: VESSEL ARRIVED AT DESTINATION PORT, OUT GATE FROM DESTINATION PORT</div>\n    <div>Air: FLIGHT ARRIVED AT DESTINATION AIRPORT, DEPARTED FROM DESTINATION AIRPORT</div>\n    <div><strong>Destination terminal:</strong> ARRIVED AT DESTINATION TERMINAL, DEPARTED FROM DESTINATION TERMINAL</div>\n    <div><strong>Destination ramp:</strong> ARRIVED AT DESTINATION RAMP, DEPARTED FROM DESTINATION RAMP</div>\n    <div><strong>Drop warehouse:</strong> ARRIVED AT FINAL DESTINATION, CARGO DELIVERED\n    EMPTY CONTAINER RETURNED</div>\n    <strong>Customs:</strong>\n    CUSTOMS PENDING, CUSTOMS CANCELLED, CUSTOMS NOT RELEASED, CUSTOMS INTENSIVE EXAM, CUSTOMS ADMISSIBLE, CUSTOMS DOCUMENT REQUIRED, CUSTOMS REQUIRES BROKER REVIEW, PGA RELEASED, CUSTOMS RELEASED\n  </details>\n\n\n  <strong>Catch-All:</strong> SHIPMENT UPDATED\n</details>\n"
        example: LOAD BOOKED,LOAD PICKED UP,LOAD DELIVERED
      - in: query
        name: skip
        required: false
        schema:
          type: integer
        description: Identify how many results the call will skip.
        example: 1
      - in: query
        name: take
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 500
        description: Identify how many results the call will retrieve.
        example: 250
      x-code-samples:
      - lang: Curl
        source: "curl -X GET \\ \n 'https://sandbox-api.navisphere.com/v2/events?loadNumber=20015434520' \\ \n -H 'Authorization: Bearer YOU TOKEN' \\ \n -H 'Content-Type: application/json'"
      - lang: Java
        source: "HttpResponse<String> response = Unirest.get(\"https://sandbox-api.navisphere.com/v2/events?loadNumber=20015434520\")\n .header(\"Content-Type\", \"application/json\")\n .header(\"Authorization\", \"Bearer YOU TOKEN\")\n .asString();"
      - lang: NodeJS
        source: " var request = require(\"request\");\n\n var options = { method: 'GET',\n url: 'https://sandbox-api.navisphere.com/v2/events',\n qs: { loadNumber: '20015434520' },\n headers: { \n \tAuthorization: 'Bearer YOU TOKEN',\n \t'Content-Type': 'application/json' \n }};\n\n request(options, function (error, response, body) {\n \tif (error) throw new Error(error);\n\n \tconsole.log(body);\n });"
      - lang: C#
        source: " var client = new RestClient(\"https://sandbox-api.navisphere.com/v2/events?loadNumber=20015434520\");\n var request = new RestRequest(Method.GET);\n request.AddHeader(\"Authorization\", \"Bearer YOU TOKEN\");\n request.AddHeader(\"Content-Type\", \"application/json\");\n IRestResponse response = client.Execute(request);"
      responses:
        '200':
          description: Event Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventResponses'
