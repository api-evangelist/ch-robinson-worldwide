        postalCode:
          type: string
          description: Indicates the postal code tied to the payer account; Required if accountNumber is specified.
        countryCode:
          description: Indicates the country code tied to the payer account; Required if accountNumber is specified.
          $ref: '#/components/schemas/countryCodeEnum'
        name:
          type: string
          description: Indicates the company name tied to the payer account; Required for TNT Australia domestic Third Party shipments.
          minimum: 1
          maximum: 35
        address1:
          type: string
          description: Indicates address line one tied to the payer account; Required for TNT Australia domestic Third Party shipments.
          minimum: 1
          maximum: 35
        address2:
          type: string
          description: Indicates address line two tied to the payer account; Required for TNT Australia domestic Third Party shipments.
          minimum: 1
          maximum: 35
        city:
          type: string
          description: Indicates the city tied to the payer account; Required for TNT Australia domestic Third Party shipments.
          minimum: 1
          maximum: 100
        stateProvinceCode:
          type: string
          description: Indicates the state or province of the tied to the payer account; Required for TNT Australia domestic Third Party shipments.
          minimum: 1
          maximum: 20
        contactName:
          type: string
          description: Indicates the name of the contact person tied to the payer account; Required for TNT Australia domestic Third Party shipments.
          minimum: 1
          maximum: 35
        contactPhoneNumber:
          type: string
          description: Indicates the phone number tied to the payer account; Required for TNT Australia domestic Third Party shipments.
          minimum: 1
          maximum: 20
    document:
      type: object
