    label:
      type: object
      description: Object containing information for the label
      required:
      - billTo
      - customer
      - origin
      - destination
      - packages
      - payer
      - shipDate
      properties:
        customer:
          $ref: '#/components/schemas/customer'
        billTo:
          $ref: '#/components/schemas/billTo'
        payer:
          $ref: '#/components/schemas/payer'
        carrier:
          $ref: '#/components/schemas/carrierEnum'
          description: The carrier for this shipment; Required if rateShopType is not defined.
        serviceLevel:
          $ref: '#/components/schemas/serviceLevelLabelsEnum'
          description: The service level for this shipment; Required if rateShopType is not defined.
        rateShopType:
          type: string
          description: "Required if serviceLevel is undefined and ignored if serviceLevel is defined; used to set the logic for determining the serviceLevel from rate shop results for label generation.\n  * `BestCostPromisedDelivery` - Returns the lowest cost serviceLevel that meets the desiredDeliveryDate exactly, and fails if no serviceLevel qualifies. Also returns the shipDate that must be used to achieve the desiredDeliveryDate.\n  * `BestCostMandatoryTransit` - Returns the lowest cost serviceLevel that is on or before the desiredDeliveryDate, and fails if no serviceLevel qualifies.\n  * `BestCostOptionalTransit` - Returns the lowest cost serviceLevel that is on or before the desiredDeliveryDate; if no serviceLevel qualifies, returns the lowest cost serviceLevel overall.\n  * `BestCost` - Returns the lowest cost serviceLevel; ignores desiredDeliveryDate.\n"
          enum:
          - BestCostPromisedDelivery
          - BestCostMandatoryTransit
          - BestCostOptionalTransit
          - BestCost
        shipDate:
          type: string
          description: Required; must be in ISO 8601 format. For FedEx, shipDate must not be more than 10 days in the future.
          format: date-time
        invoiceDate:
          type: string
          description: Required for UPS shipments only. Must be in ISO 8601 format (YYYY-MM-DDTHH:MM:SSZ). Used exclusively for UPS Paperless Invoice to process customs declarations, and must match the shipment's invoice date.
          format: date-time
        rateShopCarrierList:
          type: array
          description: Optional; limits the rate shop to only the carriers specified. By default, all configured carriers are rated.
          items:
            $ref: '#/components/schemas/carrierEnum'
        transactionId:
          type: string
          description: Optional; Unique identifier to correlate to the label request. If not populated, a random GUID will be used.
          minimum: 1
          maximum: 36
        desiredDeliveryDate:
          type: string
          description: Required if rateShopType is set to BestCostOptionalTransit, BestCostMandatoryTransit, or BestCostPromisedDelivery; must be in ISO 8601 format
          format: date-time
        origin:
          $ref: '#/components/schemas/location'
        destination:
          $ref: '#/components/schemas/location'
        additionalLocationList:
          type: array
          items:
            $ref: '#/components/schemas/additionalLocationLabels'
        packages:
          type: array
          description: Can define multiple packages to create multiple labels if destinations are identical.
          items:
            $ref: '#/components/schemas/package'
        isHazardous:
          type: boolean
          description: Indicates whether the shipment contains hazardous materials.
          default: false
        deliveryServiceList:
          type: array
          description: Used to specify special delivery service options (these services may incur additional charges).
          items:
            type: string
            enum:
            - SaturdayDelivery
            - NeutralDelivery
        documents:
          type: array
          description: Supporting documents to send to the carrier as part of the label request.
          items:
            $ref: '#/components/schemas/document'
        referenceNumbers:
          type: array
          description: Additional reference number objects pertaining to the whole order.
          items:
            $ref: '#/components/schemas/referenceNumber'
        description:
          type: string
          description: A description of the shipment.
        internationalShipping:
          $ref: '#/components/schemas/internationalShipping'
        rmaReason:
          type: string
          description: The RMA reason for FedEx return shipments.
        purposeOfShipment:
          type: string
          description: Required if FedEx intra-India shipment.
          enum:
          - GIFT
          - NOT_SOLD
          - PERSONAL_EFFECTS
          - REPAIR_AND_RETURN
          - SAMPLE
          - SOLD
        bookingNumber:
          $ref: '#/components/schemas/bookingNumber'
        labelResolution:
          type: integer
          description: The DPI value to use for ZPL label generation; applies to UPS, FedEx, DHL and Purolator.
          default: 203
          enum:
          - 203
          - 300
    error404:
      required:
      - statusCode
      - error
      - message
      properties:
        statusCode:
          type: integer
          description: Error code
          example: 404
        error:
          type: string
          description: Detail about the error status code
          example: Not Found
        message:
          type: string
          description: Specifies issue
          example: Not Found
    hazardousMaterial:
      type: object
      required:
      - hazardousMaterials
      properties:
        massCapacity:
          type: number
          format: float
          description: The mass capacity of the hazardous material; Required for FedEx Express Service Levels and for UPS if commodityRegulationType is ExceptedQuantity, LimitedQuantity, or FullyRegulated and if the field applies to the material by regulation.
          minimum: 0.0
        massCapacityUnitOfMeasure:
          type: string
          description: The unit of measure for the mass capacity of the hazardous material; Required when massCapacity is provided.
          enum:
          - Pounds
          - Ounces
          - Kilograms
          - Grams
          - Liters
          - Milliliters
          - Pints
          - Quarts
          - Gallons
          - Curies
          - Millicuries
          - Gigabecquerels
          - Megabecquerels
        containerType:
          type: string
          description: The type of container used to hold the hazardous material. Ex. glass jug, fiberboard box, plastic bottle; Required for FedEx Express Service Levels and for UPS if commodityRegulationType is LimitedQuantity or FullyRegulated and if the field applies to the material by regulation.
          minLength: 1
          maxLength: 100
        containerQuantity:
          type: string
          description: The number of identical containers in the package holding the same hazardous material; Required for UPS if commodityRegulationType is LimitedQuantity or FullyRegulated and if the field applies to the material by regulation.
          minimum: 1
        outerPackagingType:
          type: string
          description: The type of nested packaging used to encapsulate the inner containers with the hazardous material. Ex. For a large box containing plastic bottles of alcohol inside small boxes, this would describe the small boxes containing the plastic bottles; Reserved for future use.
          minLength: 1
          maxLength: 100
        outerPackagingQuantity:
          type: string
          description: The number of nested packages used to encapsulate the inner containers with the hazardous material. Ex. For a large box containing plastic bottles of alcohol inside small boxes, this would count the small boxes containing the plastic bottles; Reserved for future use.
          minimum: 1
        regulationSet:
          type: string
          description: The hazardous material shipping regulation set applicable to the hazardous material; Required for UPS.
          enum:
          - IATA
          - TDG
          - DOT
          - ORMD
          - ADR
          - CFR
        regulatoryIdNumber:
          type: string
          description: Required; The UN/NA/ID Identification Number assigned to the hazardous material.
          minLength: 1
          maxLength: 10
        hazardClassDivisionNumber:
          type: string
          description: The primary hazard class or division number assigned to the hazardous material; Required for UPS if commodityRegulationType is ExceptedQuantity, LimitedQuantity, or FullyRegulated and if the field applies to the material by regulation.
          $ref: '#/components/schemas/hazardousClassDivisionNumberEnum'
        subHazardClassDivisions:
          type: array
          description: The subsidary hazard class or division numbers assigned to the hazardous material; Optional.
          items:
            type: string
            $ref: '#/components/schemas/hazardousClassDivisionNumberEnum'
        packingGroup:
          type: string
          description: The IATA packing group for the hazardous material; Required for FedEx and TNT, and required for UPS if commodityRegulationType is LimitedQuantity or FullyRegulated and if the field applies to the material by regulation.
          enum:
          - I
          - II
          - III
        packagingInstructionCode:
          type: string
          description: The code for the packaging instructions used to pack the hazardous material; Required for FedEx Express Service Levels and for UPS if commodityRegulationType is LimitedQuantity or FullyRegulated and if the field applies to the material by regulation.
          minLength: 1
          maxLength: 10
        properShippingName:
          type: string
          description: The proper shipping name for the hazardous material assigned by ADR, CFR or IATA; Required for UPS and TNT.
          minLength: 1
          maxLength: 150
        technicalName:
          type: string
          description: The technical name for the hazardous material; Required for UPS if commodityRegulationType is LimitedQuantity or FullyRegulated and if the field applies to the material by regulation and if the field applies to the material by regulation.
          minLength: 1
          maxLength: 200
        isAccessible:
          type: boolean
          description: Indicates whether or not the hazardous material is accessible by the carrier during transport (ex. accessible by the flight crew in-flight); FedEx Only.
        commodityRegulationLevel:
          type: string
          description: The regulation level for the hazardous material; Required for UPS and TNT.
          enum:
          - LightlyRegulated
          - FullyRegulated
          - LimitedQuantity
          - ExceptedQuantity
        transportationMode:
          type: string
          description: The transportation mode that the hazardous material was prepared for; Required for UPS if regulationSet is anything other than ADR or if commodityRegulationType is LimitedQuantity or FullyRegulated.
          enum:
          - Ground
          - Highway
          - PassengerAircraft
          - CargoAircraftOnly
        emergencyContact:
          type: string
          description: The name of the person to contact in the event of an emergency; Optional.
          minLength: 1
          maxLength: 35
        emergencyPhoneNumber:
          type: string
          description: The telephone number to contact in the event of an emergency; Required for FedEx.
          minLength: 1
          maxLength: 25
        additionalDescription:
          type: string
          description: Additional information about the hazardous material. This could be additional regulatory information, additional handling details, etc; Required for UPS if commodityRegulationType is LimitedQuantity or FullyRegulated and if the field applies to the material by regulation.
          maxLength: 250
        chemicalRecordIdentifier:
          type: string
          description: Identifies the hazardous material in a package. If a package contains multiple hazardous materials, each one should be clearly labeled with an identifier so that it can be easily recognized; Required for UPS.
          minLength: 1
          maxLength: 3
        hazardousMaterialType:
          type: string
          description: The type of hazardous material; Required for FedEx.
          enum:
          - HazardousMaterials
          - LimitedQuantitiesCommodities
          - Battery
          - ORMD
          - ReportableQuantities
          - SmallQuantityException
        hazardousContentDescription:
          type: string
          description: The hazardous material content ID; Required for DHL.
          enum:
          - DryIceUN1845
          - LithiumIonBatteryPI965SectionII
          - LithiumIonBatteryWithEquipmentPI966SectionII
          - LithiumIonBatteryInEquipmentPI967SectionII
          - LithiumMetalBatteryWithEquipmentPI969SectionII
          - LithiumMetalBatteryInEquipmentPI970SectionII
          - LimitedQuantitiesADR
          - ExceptedQuantitiesIATA
          - BiologicalSubstancesUN3373
          - DGPerAttachedDGDPAX
          - DGPerAttachedDGDCAO
          - GeneticallyModifiedOrganisms
          - Class9ConsumerCommodities
          - ADRLoadExemptions
          - UN2807MagnetizedMaterial
          - UN3164PI208aArticlesPressurizedHydraulic
          - UN3164PI208aArticlesPressurizedPneumatic
          - ExemptHumanSpecimen
          - ExemptAnimalSpecimen
          - NotRestrictedSpecialProvision
    payer:
      type: object
      description: The party responsible for paying the shipping charges.
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/payerTypeEnum'
          description: The payer type.
        accountNumber:
          type: string
          minLength: 1
          maxLength: 100
