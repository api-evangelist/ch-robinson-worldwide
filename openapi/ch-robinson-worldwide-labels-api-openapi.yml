      - lang: Curl
        source: "curl -X POST \\ \n https://sandbox-api.navisphere.com/v1/labels \\\n -H 'Authorization: Bearer YOUR TOKEN' \\\n 'Content-Type: application/json' \\\n -d '{\n \t\"customer\": { \n \t\t\"customerCode\": \"C8283603\" \n \t}, \n \t\"billTo\": { \n \t\t\"customerCode\": \"C8283603\", \n \t\t\"currencyCode\": \"USD\" \n \t}, \n \t\"payer\": { \n \t\t\"Type\": \"Sender\" \n \t}, \n \t\"rateShopType\": \"BestCost\", \n \t\"shipDate\": \"2020-05-26T00:00:00.000Z\", \n \t\"desiredDeliveryDate\": \"2020-05-29T00:00:00.000Z\", \n \t\"origin\": {\n \t\t\"customerLocationId\": \"12345\", \n \t\t\"name\": \"Test Origin\", \n \t\t\"contactName\": \"Origin Contact Name\", \n \t\t\"contactPhoneNumber\": \"5555555555\", \n \t\t\"address\": { \n \t\t\t\"address1\": \"14900 Charlson Rd.\", \n \t\t\t\"city\": \"Eden Prairie\", \n \t\t\t\"stateProvinceCode\": \"MN\", \n \t\t\t\"postalCode\": \"55347\", \n \t\t\t\"countryCode\": \"US\" \n \t\t} \n \t}, \n \t\"destination\": {\n \t\t\"customerLocationId\": \"67890\", \n \t\t\"name\": \"Test Destination\", \n \t\t\"contactName\": \"Destination Contact Name\", \n \t\t\"contactPhoneNumber\": \"5555555555\", \n \t\t\"address\": { \n \t\t\t\"address1\": \"315 N Racine Ave.\", \n \t\t\t\"address2\": \"#501\", \n \t\t\t\"city\": \"Chicago\", \n \t\t\t\"stateProvinceCode\": \"IL\", \n \t\t\t\"postalCode\": \"60607\", \n \t\t\t\"countryCode\": \"US\" \n \t\t} \n \t}, \n \t\"packages\": [{ \n \t\t\"contents\": [{ \n \t\t\t\"countryOfOriginCode\": \"US\", \n \t\t\t\"description\": \"Test Widget\", \n \t\t\t\"value\": 123.45, \n \t\t\t\"currencyCode\": \"USD\", \n \t\t\t\"quantity\": 100, \n \t\t\t\"quantityUnitOfMeasure\": \"No_Unit_Required\", \n \t\t\t\"weight\": 5, \n \t\t\t\"weightUnitOfMeasure\": \"Pounds\"\n \t\t}], \n \t\t\"receiverName\": \"Test Receiver\", \n \t\t\"receiverPhoneNumber\"555-555-5555\", \n \t\t\"documentsOnly\": false, \n \t\t\"height\": 10, \n \t\t\"length\": 11, \n \t\t\"linearUnitOfMeasure\": \"Inches\": \n 