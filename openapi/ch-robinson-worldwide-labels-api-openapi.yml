nitOfMeasure\": \"No_Unit_Required\",\n                    \"weight\": 5,\n                    \"weightUnitOfMeasure\": \"Pounds\"\n                }\n            ],\n            \"receiverName\": \"Test Receiver\",\n            \"receiverPhoneNumber\": \"555-555-5555\",\n            \"documentsOnly\": false,\n            \"height\": 10,\n            \"length\": 11,\n            \"linearUnitOfMeasure\": \"Inches\",\n            \"description\": \"Test Package\",\n            \"packagingType\": \"Customer_Package\",\n            \"weight\": 5,\n            \"weightUnitOfMeasure\": \"Pounds\",\n            \"width\": 12,\n            \"labelCustomerReferenceNumber\": \"9876543210\",\n            \"labelReferenceData1\": \"12345\",\n            \"labelReferenceData2\": \"67890\"\n        },\n        {\n            \"contents\": [\n                {\n                    \"countryOfOriginCode\": \"US\",\n                    \"description\": \"Test Widget\",\n                    \"value\": 123.45,\n                    \"currencyCode\": \"USD\",\n                    \"quantity\": 100,\n                    \"quantityUnitOfMeasure\": \"No_Unit_Required\",\n                    \"weight\": 5,\n                    \"weightUnitOfMeasure\": \"Pounds\",\n                    \"eccn\": \"3A001\"\n                }\n            ],\n            \"receiverName\": \"Test Receiver\",\n            \"receiverPhoneNumber\": \"555-555-5555\",\n            \"documentsOnly\": false,\n            \"height\": 10,\n            \"length\": 11,\n            \"linearUnitOfMeasure\": \"Inches\",\n            \"description\": \"Test Package\",\n            \"packagingType\": \"Customer_Package\",\n            \"weight\": 5,\n            \"weightUnitOfMeasure\": \"Pounds\",\n            \"width\": 12\n        }\n    ],\n    \"referenceNumbers\": [\n      {\n          \"type\": \"CON\",\n          \"value\": \"325423455\"\n      }\n    ],\n    \"description\": \"Test Shipment\"\n  }\", ParameterType.Req