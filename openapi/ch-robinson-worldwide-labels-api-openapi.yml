components:
  schemas:
    exportReasonCode:
      type: string
      description: A value required for DHL international shipments indicating why the shipment is being exported.
      enum:
      - Permanent
      - Temporary
      - Re_Export
    packageLabel:
      properties:
        labelData:
          description: The base 64 encoded label data.
          type: string
        labelFormat:
          description: The format (PNG image, PDF document, etc.) of the label data.
          type: string
          enum:
          - PDF
          - PNG
          - GIF
          - ZPL
          - EPL
          - DPL
        mimeType:
          description: The MIME type of the label data.
          type: string
    hazardousPackageInformation:
      type: object
      description: Additional information about any hazardous materials or dangerous goods in the package.
      required:
      - hazardousMaterials
      properties:
        hazardousMaterials:
          type: array
          description: The list of hazardous materials in the package.
          items:
            $ref: '#/components/schemas/hazardousMaterial'
        signatory:
          $ref: '#/components/schemas/signatory'
        packagingType:
          type: string
          description: The outermost type of packaging used for package containing hazardous materials. Ex. fiberboard box, steel drum, plastic jug; Reserved for future use.
          minLength: 1
          maxLength: 100
        isOverpack:
          type: boolean
          description: A flag indicating if the package containing hazardous materials is an overpack; Optional.
        isAllPackedInOne:
          type: boolean
          description: A flag indicating if the package contains multiple containers with different hazardous materials; Optional.
        qValue:
          type: string
          description: The Q-Value of the package containing hazardous materials; Optional.
          minLength: 1
          maxLength: 3
        offeror:
          type: string
          description: The offeror of the package containing hazardous materials; Required for FedEx.
          minLength: 1
          maxLength: 100
    labelReferenceData2:
      type: string
      description: Second piece of reference data to be used on the package label. This is used as the PO Number for FedEx or Reference Number 2 for UPS (not used for DHL or TNT).
      minLength: 1
      maxLength: 35
    packageShippingInfo:
      properties:
        id:
          type: string
        labels:
          type: array
          items:
            $ref: '#/components/schemas/packageLabel'
        rate:
          type: string
        rateCurrencyCode:
          type: string
        trackingNumber:
          type: string
    internationalShipping:
      type: object
      description: Elements specific to international shipping scenarios.
      properties:
        isDutiable:
          type: boolean
          description: A flag required for DHL international shipments indicating whether or not the shipment is dutiable.
        exportReasonCode:
          $ref: '#/components/schemas/exportReasonCode'
        AESTransactionNumber:
          $ref: '#/components/schemas/AESTransactionNumber'
        AESExempt:
          type: boolean
          description: Indicates that goods being shipped are exempt from AES Export Filing; FedEx only, Optional.
        dutyPayerType:
          $ref: '#/components/schemas/payerTypeEnum'
          description: Indicates which party involved in a shipment is responsible for duty payment; Required for all international shipments (including when the isDutiable flag is false).
        dutyPayerAccountNumber:
          $ref: '#/components/schemas/dutyPayerAccountNumber'
        dutyPayerPostalCode:
          type: string
          description: Postal code of the party paying the duty charges; Used for a dutyPayerType of Third_Party.
          minLength: 1
          maxLength: 20
        dutyPayerCountryCode:
          $ref: '#/components/schemas/countryCodeEnum'
          description: Country code of the party paying the duty charges; Used for a dutyPayerType of Third_Party.
        dutyPayerName:
          type: string
          description: Indicates the company name tied to the duty payer account; Reserved for future use.
          minimum: 1
          maximum: 35
        dutyPayerAddress1:
          type: string
          description: Indicates address line one tied to the duty payer account; Reserved for future use.
          minimum: 1
          maximum: 35
        dutyPayerAddress2:
          type: string
          description: Indicates address line two tied to the duty payer account; Reserved for future use.
          minimum: 1
          maximum: 35
        dutyPayerCity:
          type: string
          description: Indicates the city tied to the duty payer account; Reserved for future use.
          minimum: 1
          maximum: 100
        dutyPayerStateProvinceCode:
          type: string
          description: Indicates the state or province of the tied to the duty payer account; Reserved for future use.
          minimum: 1
          maximum: 20
        dutyPayerContactName:
          type: string
          description: Indicates the name of the contact person tied to the duty payer account; Reserved for future use.
          minimum: 1
          maximum: 35
        dutyPayerContactPhoneNumber:
          type: string
          description: Indicates the phone number tied to the duty payer account; Reserved for future use.
          minimum: 1
          maximum: 20
        incoTerms:
          type: string
          description: Specifies who is responsible for paying for and managing the shipment; Optional - FedEx and DHL only.
          enum:
          - CFR
          - CIF
          - CIP
          - CPT
          - DAF
          - DAP
          - DAT
          - DDP
          - DDU
          - DEQ
          - DES
          - DPU
          - EXW
          - FAS
          - FCA
          - FOB
    carrierMessage:
      properties:
        source:
          type: string
        carrier:
          type: string
        message:
          type: string
    billTo:
      description: The bill to on the order.
      required:
      - customerCode
      - currencyCode
      properties:
        customerCode:
          type: string
          description: C.H. Robinson defined bill to customer code. This will be provided by your C.H. Robinson rep.
          minimum: 1
          maximum: 50
        currencyCode:
          type: string
          $ref: '#/components/schemas/currencyCodeEnum'
          description: "Code to indicate the currency being used. The most common currently in use with C.H. Robinson:\n\n* `USD` - US Dollar\n* `CAD` - Canadian Dollar \n* `MXN` - Mexican Peso\n* `EUR` - European Euro"
        referenceNumbers:
          type: array
          description: Additional reference number objects pertaining to the customer object.
          items:
            $ref: '#/components/schemas/referenceNumber'
    customer:
      description: The customer on the order.
      required:
      - customerCode
      properties:
        customerCode:
          type: string
          description: C.H. Robinson defined customer code. This will be provided by your C.H. Robinson rep.
          minimum: 1
          maximum: 50
        referenceNumbers:
          type: array
          description: Additional reference number objects pertaining to the customer object.
          items:
            $ref: '#/components/schemas/referenceNumber'
    content:
      required:
      - countryOfOriginCode
      - description
      - value
      - currencyCode
      - quantity
      - weight
      - weightUnitOfMeasure
      properties:
        countryOfOriginCode:
          description: Indicates country of origin of the contents; Required for all international shipments.
          $ref: '#/components/schemas/countryCodeEnum'
        description:
          type: string
          description: Description of the contents of the package; Required for all international shipments.
          maxLength: 35
        commodityCode:
          type: string
          description: Code used by customs authorities to identify products when assessing duties and taxes. Required for DHL Paperless International Shipments.
          minimum: 6
          maximum: 10
        value:
          type: number
          description: Approximate value of the contents for customs purposes; Required for all international shipments.
          format: float
          minimum: 0.01
        currencyCode:
          $ref: '#/components/schemas/currencyCodeLabelsEnum'
          description: Currency code tied to the value; Required for all international shipments.
        quantity:
          type: number
          description: Number of pieces in the package; Required for all international shipments.
          format: integer
          minimum: 1
        quantityUnitOfMeasure:
          type: string
          description: Quantity unit of measurement for the contents of the package. Required for UPS Paperless Invoice.
          enum:
          - Pieces
          - Dozen
          - Dozen_Pieces
          - Dozen_Pairs
          - Hundred
          - Kilograms
          - Meters
          - Number
          - Packs
          - Pairs
          - No_Unit_Required
          - Thousand
        weight:
          type: number
          description: Weight of the contents of the package; Required for all international shipments. For a given package, the sum of the weight of the contents must be less than or equal to the package weight.
          format: float
          minimum: 0.01
        weightUnitOfMeasure:
          type: string
          description: Weight unit of measurement for the contents of the package; Required for all international shipments, and must match package weightUnitOfMeasure.
          enum:
          - Pounds
          - Kilograms
        eccn:
          type: string
          description: Export Control Classification Number; reserved for future use.
          minLength: 5
          maxLength: 5
