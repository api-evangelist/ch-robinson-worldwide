    address:
      description: Object that contains address specific information.
      required:
      - address1
      - city
      - countryCode
      properties:
        address1:
          type: string
          description: Required; Indicates address line one of the location.
          minLength: 1
          maxLength: 35
        address2:
          type: string
          description: Indicates address line two of the location.
          minLength: 1
          maxLength: 35
        address3:
          type: string
          description: Indicates address line three of the location.
          minLength: 1
          maxLength: 35
        address4:
          type: string
          description: Indicates address line four of the location.
          minLength: 1
          maxLength: 35
        city:
          type: string
          description: Required; Indicates the city of the location.
          minLength: 1
          maxLength: 100
        stateProvinceCode:
          type: string
          description: Indicates the state or province of the location. Required if countryCode is one of the following - AF, AR, AU, BR, CA, CN, ES, IT, KR, MX, PF, PG, PW, RU, SC, TH, TO, TV, US, USA, UY, VE, VN
          minLength: 1
          maxLength: 20
        postalCode:
          type: string
          description: Indicates the postal code of the location, sometimes refered to as the zip code. Required unless countryCode is one of the following - AE, AG, AO, AW, BF, BI, BJ, BM, BO, BQ, BS, BW, BZ, CD, CF, CG, CI, CK, CM, CW, DJ, DM, ER, FJ, GA, GD, GH, GM, GQ, GY, HK, JM, KI, KM, KN, KP, LY, MO, MR, MW, PS, QA, RW, SB, SC, SL, SR, SS, ST, SX, SY, TD, TF, TG, TK, TL, TO, TV, UG, VU, YE, ZW
          minLength: 1
          maxLength: 20
        countryCode:
          $ref: '#/components/schemas/countryCodeLabelsEnum'
    successLabelCreate:
      properties:
        labelResponseId:
          type: string
        orderNumber:
          description: C.H. Robinson order number received on successful order create.
          type: number
        carrier:
          $ref: '#/components/schemas/carrierEnum'
        serviceLevel:
          $ref: '#/components/schemas/serviceLevelEnum'
        shipDate:
          description: The date on which the shipment will be picked up.
          type: string
          format: date-time
        scheduledDeliveryDate:
          description: The date on which the shipment should be delivered.
          type: string
          format: date-time
        shippingPackages:
          description: Shipping info about the packages included in the shipment.
          type: array
          items:
            $ref: '#/components/schemas/packageShippingInfo'
        airWaybillNumber:
          description: The air waybill number for the shipment.
          type: string
        bookingNumber:
          $ref: '#/components/schemas/bookingNumber'
        shippingDocuments:
          description: Metadata returned from the carrier for any uploaded documents.
          type: array
          items:
            $ref: '#/components/schemas/documentInfo'
        referenceNumbers:
          description: Reference number objects pertaining to the whole order.
          type: array
          items:
            $ref: '#/components/schemas/referenceNumber'
        carrierMessages:
          description: Messages returned from the carrier(s).
          type: array
          items:
            $ref: '#/components/schemas/carrierMessage'
    error401:
      required:
      - statusCode
      - error
      - message
      properties:
        statusCode:
          type: integer
          description: Error code
          example: 401
        error:
          type: string
          description: Detail about the error status code
        message:
          type: string
          description: Specifies issue
        attributes:
          type: object
          properties:
            error:
              type: string
    package:
      description: Describes a package
      required:
      - packagingType
      - weight
      - weightUnitOfMeasure
      - length
      - width
      - height
      - linearUnitOfMeasure
      properties:
        contents:
          type: array
          description: Required for international shipments (origin and destination countryCode do not match). Itemized package contents.
          items:
            $ref: '#/components/schemas/content'
        deliveryConfirmation:
          type: string
          description: Used on specify if signature is required on delivery (this service may incur additional charges).
          enum:
          - SignatureRequired
          - AdultSignatureRequired
        documentsOnly:
          type: boolean
          description: Used on DHL shipments to indicate if the package only contains documents.
          default: false
        declaredValue:
          type: number
          description: Used to request package insurance (this service may incur additional charges)
          format: currency
        declaredValueCurrencyCode:
          type: string
          description: Code to indicate the currency being used for insurance; Required if declaredValue is populated.
        collectOnDelivery:
          type: string
          description: Used to request COD service from the parcel provider; Reserved for future use.
          enum:
          - Guaranteed
          - NonGuaranteed
        collectOnDeliveryAmount:
          type: number
          description: Money value to collect upon delivery; Reserved for future use.
          format: currency
        collectOnDeliveryCurrencyCode:
          description: Code to indicate the currency being used; Reserved for future use.
          type: string
        description:
          type: string
          description: General description of the package contents for Returns Services.
          maxLength: 35
          default: Consumer Items
        packagingType:
          type: string
          description: Required; Used to specify if prepaid carrier-branded envelopes or boxes are being used; Customer_Package should be passed if this is unknown.
          enum:
          - USPS_Flat_Rate_Padded_Envelope
          - USPS_Flat_Rate_Legal_Envelope
          - USPS_Flat_Rate_Window_Envelope
          - USPS_Flat_Rate_Gift_Card_Envelope
          - USPS_Small_Flat_Rate_Box
          - USPS_Large_Flat_Rate_Box
          - USPS_Irregular_Parcel
          - USPS_Oversized_Parcel
          - USPS_Large_Parcel
          - USPS_Flat_Rate_Cardboard_Envelope
          - DHL_Box
          - DHL_Lab_Pak
          - Customer_Package
          - DHL_Letter
          - USPS_Regional_Rate_Box_B
          - USPS_DVD_Flat_Rate_Box
          - USPS_Small_Flat_Rate_Envelope
          - USPS_Regional_Rate_Box_A
          - USPS_Large_Video_Flat_Rate_Box
          - USPS_Flat_Rate_Envelope
          - UPS_Letter
          - FedEx_25kg_Box
          - UPS_Pak
          - UPS_Tube
          - FedEx_10kg_Box
          - FedEx_Pak
          - FedEx_Envelope
          - FedEx_Tube
          - FedEx_Box
          - UPS_Express_Box
          - USPS_Flat
          - USPS_Letter
          - USPS_Medium_Flat_Rate_Box
          - USPS_Parcel
          - USPS_Card
          - UPS_10_KG_Box
          - UPS_25_KG_Box
          - USPS_Package
          - UPS_Pallet
          - UPS_Large_Express_Box
          - UPS_Medium_Express_Box
          - UPS_Small_Express_Box
        weight:
          type: number
          description: Required; weight of the package. Most parcel carriers enforce a maximum of 150 lbs or 68 kg.
          format: float
          minimum: 0.01
          maximum: 999.99
        weightUnitOfMeasure:
          type: string
          description: Required; weight unit of measurement.
          enum:
          - Pounds
          - Kilograms
        length:
          type: number
          description: Required; length of the package. Most parcel carriers enforce a maximum of 108 inches.
          format: float
          minimum: 0.01
          maximum: 999.99
        width:
          type: number
          description: Required; width of the package.
          format: float
          minimum: 0.01
          maximum: 999.99
        height:
          type: number
          description: Required; height of the package.
          format: float
          minimum: 0.01
          maximum: 999.99
        linearUnitOfMeasure:
          type: string
          description: Required; units of measurement the length, width, and height are defined in. Metric values require the Package weightUnitOfMeasure to be Kilograms, and Imperial values require Pounds.
          enum:
          - Inches
          - Feet
          - Centimeters
          - Meters
        labelReferenceData1:
          $ref: '#/components/schemas/labelReferenceData1'
        labelReferenceData2:
          $ref: '#/components/schemas/labelReferenceData2'
        labelReferenceData3:
          $ref: '#/components/schemas/labelReferenceData3'
        referenceNumbers:
          type: array
          description: Additional reference number objects pertaining to the package object (do not show on label).
          items:
            $ref: '#/components/schemas/referenceNumber'
        hazardousPackageInformation:
          description: Additional information about any hazardous materials or dangerous goods in the package.
          $ref: '#/components/schemas/hazardousPackageInformation'
