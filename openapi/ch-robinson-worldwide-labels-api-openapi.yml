openapi: 3.2.0
info:
  version: 2.0.0
  title: A guide to C.H. Robinson's REST Labels API
  description: '# Introduction

    Welcome to C.H.'
servers:
- url: https://sandbox-api.navisphere.com
  description: Test environment.
- url: https://api.navisphere.com
  description: Production environment.
security:
- sandbox: []
tags:
- name: Labels
  description: 'A service for generating small parcel shipping labels. An associated C.H. Robinson order is also created to track the package updates through Navisphere®. Note: Configuration of your company’s parcel carrier account details within Navisphere® is required as a prerequisite for using this API. Contact your C.H. Robinson or TMC account representative to begin this process.'
paths:
  /v1/labels:
    post:
      operationId: Generate label
      tags:
      - Labels
      requestBody:
        description: JSON object of label information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/label'
            example:
              customer:
                customerCode: C8283603
              billTo:
                customerCode: C8283603
                currencyCode: USD
              payer:
                type: Sender
              rateShopType: BestCost
              shipDate: '2020-05-26T00:00:00.000Z'
              desiredDeliveryDate: '2020-05-29T00:00:00.000Z'
              origin:
                customerLocationId: 12345
                name: Test origin
                contactName: Origin Contact Name
                contactPhoneNumber: 5555555555
                address:
                  address1: 14900 Charlson Rd.
                  city: Eden Prairie
                  stateProvinceCode: MN
                  postalCode: 55347
                  countryCode: US
              destination:
                customerLocationId: 67890
                name: Test Destination
                contactName: Destination Contact Name
                contactPhoneNumber: 5555555555
                address:
                  address1: 315 N Racine Ave.
                  address2: '#501'
                  city: Chicago
                  stateProvinceCode: IL
                  postalCode: 60607
                  countryCode: US
              packages:
              - contents:
                - countryOfOriginCode: US
                  description: Test widget
                  value: 123.45
                  currencyCode: USD
                  quantity: 100
                  quantityUnitOfMeasure: No_Unit_Required
                  weight: 5
                  weightUnitOfMeasure: Pounds
                receiverName: Test Receiver
                receiverPhoneNumber: 555-555-5555
                documentsOnly: false
                height: 10
                length: 11
                linearUnitOfMeasure: Inches
                description: Test Package
                packagingType: Customer_Package
                weight: 5
                weightUnitOfMeasure: Pounds
                width: 12
                labelCustomerReferenceNumber: 9876543210
                labelReferenceData1: 12345
                labelReferenceData2: 67890
              referenceNumbers:
              - type: CON
                value: 325423455
              description: Test Shipment
      responses:
        '201':
          description: Request Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successLabelCreate'
              example:
                labelResponseId: 9dab96ff-5dea-459e-a549-f1808c8259c6
                orderNumber: 7030640
                carrier: FDX
                serviceLevel: FedEx_Ground
                shipDate: '2020-05-26T00:00:00.0000000'
                scheduledDeliveryDate: '2020-05-28T23:59:00.0000000'
                shippingPackages:
                - id: 794613487241
                  labels:
                  - labelData: 
                    labelFormat: image/png
                  rate: 10.2
                  rateCurrencyCode: USD
                  trackingNumber: 794613487321
                referenceNumbers:
                - type: VPO
                  value: Jason
                - type: CON
                  value: 325423455
                carrierMessages:
                - source: Rating
                  carrier: DHL
                  message: DHL returned a zero price for ParcelServiceLevelRDN 5304 (EXPRESS DOMESTIC)
                - source: Rating
                  message: Your invoice may vary from the displayed reference rates
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error404'
        '424':
          description: Failed Dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error424'
