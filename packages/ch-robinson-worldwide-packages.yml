note: >-
  C.H. Robinson publishes NO first-party client library for its REST APIs. The Navisphere
  B2B contract is consumed directly over HTTP; the only onboarding aid the provider ships
  is a public Postman collection (see postman/). The packages below are genuine first-party
  C.H. Robinson open source, but they are Apache Avro / Kafka tooling from the company's
  engineering org - they do NOT wrap the freight APIs described in
  openapi/ch-robinson-worldwide-rest-apis-openapi.yml. For that reason this artifact carries
  a Packages pointer only and deliberately does NOT emit an SDKs pointer: counting Avro
  serializers as API SDKs would credit C.H. Robinson with client libraries it does not ship.
