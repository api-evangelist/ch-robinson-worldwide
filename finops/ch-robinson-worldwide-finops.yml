    description: Allocate freight cost by mode, lane, and BU using PO / shipment metadata pushed through
      the API.
  - name: Optimization
    description: Optimize mode mix, consolidate shipments, and exercise contract rate reviews; lean on
      C.H. Robinson sourcing for spot-vs-contract decisions.
  - name: Accountability
    description: Logistics / supply chain function owns C.H. Robinson spend; audit accessorial charges
      and review carrier performance.
